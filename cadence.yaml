# Fichiers dérivés du plan : un commit qui ne touche que le plan et ceux-ci est de
# l'entretien du plan (pas de lot à citer, ne compte pour aucun lot).
plan:
  files: [frontend/public/plan-data/plan.json, frontend/public/nouveautes-data/nouveautes.json]
# Livraison par `cadence deliver` (https://github.com/Sylad/cadence) :
# CI du sha poussé → bump du tag dans developpeur-gitops → vérification de l'effet.
deliver:
  ci: github
  deploy:
    - ./scripts/deploy.sh
  verify:
    - command: ./scripts/verify-rollout.sh
    - url: https://ol.sladoire.dev/api/health
      contains: '"status":"ok"'
    # l'effet, pas seulement la santé : le 03-10, /api/health répondait ok avec un effectif vide
    - url: https://ol.sladoire.dev/api/lineup
      contains: '"starters"'
    - url: https://ol.sladoire.dev/api/standings
      contains: '"table"'
    # le calendrier lit la saison toutes compétitions (qualifications de Ligue des champions comprises)
    - url: https://ol.sladoire.dev/api/season-matches
      contains: 'Ligue des champions'
    - url: https://ol.sladoire.dev/
    # ce que reçoit un visiteur revenu après une livraison : le document en no-cache
    # (sinon l'ancienne appli reste affichée — 1 h 25 mesurée le 03-10) et 404, pas le
    # repli HTML, pour un fichier absent de /assets/
    - command: ./scripts/verify-cache.sh
  verifyTimeout: 600

# Revue UX automatique des vagues (cadence orchestrate) : backend NestJS (3002) + frontend Vite (5174)
# dans UN groupe de processus, tués ensemble par le programme.
orchestrate:
  # Escalade (L221, cadence L337 / 1.12.0) : avant de rendre un lot encore non conforme après ses passes, la vague joue
  # une correction et une revue neuve en Fable (règle du lead depuis le 17-10, oubliée deux fois à la main).
  escalation: { model: fable }
  # Précheck sur Sonnet pour tout lot sans commit (L220, comme warhammer L203) : le modèle local (precheck: local)
  # plantait 1 lot sur 3 et répondait « oui » à tort (cadence L328, 25-10).
  precheck: true
  # Porte de tests de la vague (L220), lancée après chaque implement/fix : la CI « Contrôles frontend » a été rouge
  # 4 fois du 17 au 19-10 faute que la vague lance la suite. Commandes vérifiées vertes sur main le 25-10 :
  # backend jest 471 tests (45 suites), frontend vitest 1152 tests (140 fichiers). Exclus et dits : le e2e backend
  # hermétique (`npm run test:e2e`, config jest à part, démarre tout l'AppModule : lent, il expirerait sous la charge
  # de la suite complète) et les tests Chromium (`npm run test:navigateur`, demandent Playwright) ; aucun
  # `*.e2e.spec.ts` n'existe côté frontend. Les acceptations rouges (vert: false) restent exclues par
  # vitest.config.ts et ne passent que par `accept:`.
  test: (cd backend && npm test) && (cd frontend && npm test)
  # Build backend (nest build) puis frontend (tsc -b, vite build, contrôle de fuite du plan), verts le 25-10.
  build: (cd backend && npm run build) && (cd frontend && npm run build)
  ux:
    command: '(cd backend && npm run start:dev) & (cd frontend && npm run dev -- --port 5174 --strictPort) & wait'
    url: http://localhost:5174
    timeout: 300
  # Étape spec d'un lot à écran (screen:) : fiche + maquette sous docs/specs/<écran>/, revue de maquette,
  # puis tests d'acceptation rouges lancés par la commande dédiée ci-dessous (lanceur dans frontend/).
  spec: { dir: docs/specs }
  accept: cd frontend && npx vitest run -c vitest.acceptation.config.ts

# Documentation qui suit le code (cadence docs.sync, L307 de cadence, 24-10) : raf check et la revue signalent un lot dont le code laisse sa doc en retard ; docs.articles = étude de cas du projet dans claude-code-codex (le bibliothécaire propose un lot là-bas).
docs:
  sync:
    # API NestJS (fixtures, standings, cups, france, players, scheduler…) : « Modules backend / endpoints clés » du CLAUDE.md et « Fonctionnalités » du README.
    - paths: ['backend/src/**', '!**/*.test.*', '!**/*.spec.*', '!**/__snapshots__/**']
      docs: [README.md, CLAUDE.md]
    # Écrans React (routes, composants, router) : « Fonctionnalités » du README, CLAUDE.md ; une Nouveauté vaut pour un changement visible.
    - paths: ['frontend/src/**', '!**/*.css', '!frontend/src/test/**', '!**/*.test.*', '!**/*.spec.*', '!**/__snapshots__/**']
      docs: [README.md, CLAUDE.md, 'docs/nouveautes/*.md']
  since: 2026-10-24
  articles:
    - repo: ../claude-code-codex
      file: frontend/src/pages/case-studies/ol-companion.astro
