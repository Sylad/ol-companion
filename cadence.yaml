# Livraison par `cadence deliver` (https://github.com/Sylad/cadence) :
# CI du sha poussé → bump du tag dans developpeur-gitops → vérification de l'effet.
deliver:
  ci: github
  deploy:
    - ./scripts/deploy.sh
  verify:
    - command: ./scripts/verify-rollout.sh
    - url: https://ol.sladoire.dev/api/health
      contains: '"status":"ok"'
    # l'effet, pas seulement la santé : le 03-10, /api/health répondait ok avec un effectif vide
    - url: https://ol.sladoire.dev/api/lineup
      contains: '"starters"'
    - url: https://ol.sladoire.dev/api/standings
      contains: '"table"'
    # le calendrier lit la saison toutes compétitions (qualifications de Ligue des champions comprises)
    - url: https://ol.sladoire.dev/api/season-matches
      contains: 'UEFA Champions League'
    - url: https://ol.sladoire.dev/
  verifyTimeout: 600
