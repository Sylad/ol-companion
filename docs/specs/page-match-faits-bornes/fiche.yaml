ecran:
  id: page-match-faits-bornes
  titre: Page du match — bloc Faits du match à hauteur bornée
  route: /match/$gameId
  lot: L161
  largeurs: [1440, 390, 320]
  maquette: docs/specs/page-match-faits-bornes/maquette.html
etats: [vide, chargement, erreur, charge, peu-de-faits]

champs:
  - { id: message-chargement, libelle: Message de chargement, type: texte, source: statique, obligatoire: true }
  - { id: message-erreur, libelle: Message d'erreur de la page, type: texte, source: statique, obligatoire: true }
  - { id: message-stats-vide, libelle: Message sans statistiques, type: texte, source: statique, obligatoire: false }
  - { id: entete-score, libelle: En-tête du score, type: carte, source: "GET /api/live-match/{gameId}/stats → status, home, away, events", obligatoire: true }
  - { id: grille-match, libelle: Grille de la page (L160), type: liste, source: statique, obligatoire: true }
  - { id: colonne-centre, libelle: Colonne centrale haute, type: liste, source: "GET /api/live-match/{gameId}/stats", obligatoire: true }
  - { id: faits-match, libelle: Bloc Faits du match, type: carte, source: "GET /api/live-match/{gameId}/stats → events", obligatoire: false }
  - { id: compte-faits, libelle: Nombre de faits dans l'en-tête du bloc, type: texte, source: "GET /api/live-match/{gameId}/stats → events.length", obligatoire: false }
  - { id: liste-faits, libelle: Liste des faits, hauteur bornée et défilante, type: liste, source: "GET /api/live-match/{gameId}/stats → events", obligatoire: false }
  - { id: elan, libelle: Momentum, type: carte, source: "GET /api/live-match/{gameId}/stats → momentum", obligatoire: false }
  - { id: carte-tirs, libelle: Carte des tirs, type: carte, source: "GET /api/live-match/{gameId}/stats → shots", obligatoire: false }
  - { id: bloc-statistiques, libelle: Statistiques comparées, type: carte, source: "GET /api/live-match/{gameId}/stats → teamStats", obligatoire: true }
  - { id: repere-faits-anciens, libelle: Repère « N faits plus anciens » au-dessus de la liste, type: texte, source: "GET /api/live-match/{gameId}/stats → events (faits hors de la vue de la liste)", obligatoire: false }
  - { id: bloc-composition, libelle: "Bloc Composition (L160)", type: carte, source: "docs/specs/page-match-fm (hérité de L160, inchangé et hors du périmètre des tests de L161)", obligatoire: false }
  - { id: titre-composition, libelle: "Titre du bloc Composition (L160)", type: carte, source: "docs/specs/page-match-fm (hérité de L160, inchangé et hors du périmètre des tests de L161)", obligatoire: false }
  - { id: formation-composition, libelle: "Formation (L160)", type: carte, source: "docs/specs/page-match-fm (hérité de L160, inchangé et hors du périmètre des tests de L161)", obligatoire: false }
  - { id: terrain-composition, libelle: "Terrain de la composition (L160)", type: carte, source: "docs/specs/page-match-fm (hérité de L160, inchangé et hors du périmètre des tests de L161)", obligatoire: false }
  - { id: rangee-composition, libelle: "Rangée du terrain (L160)", type: carte, source: "docs/specs/page-match-fm (hérité de L160, inchangé et hors du périmètre des tests de L161)", obligatoire: false }
  - { id: banc-composition, libelle: "Banc (L160)", type: carte, source: "docs/specs/page-match-fm (hérité de L160, inchangé et hors du périmètre des tests de L161)", obligatoire: false }
  - { id: stats-equipe-domicile, libelle: "Statistiques de l'équipe à domicile (L160)", type: carte, source: "docs/specs/page-match-fm (hérité de L160, inchangé et hors du périmètre des tests de L161)", obligatoire: false }
  - { id: stats-equipe-visiteur, libelle: "Statistiques de l'équipe visiteuse (L160)", type: carte, source: "docs/specs/page-match-fm (hérité de L160, inchangé et hors du périmètre des tests de L161)", obligatoire: false }
  - { id: colonne-centre-bas, libelle: "Colonne centrale basse (L160)", type: carte, source: "docs/specs/page-match-fm (hérité de L160, inchangé et hors du périmètre des tests de L161)", obligatoire: false }
  - { id: joueurs-en-vue, libelle: "Joueurs en vue (L160)", type: carte, source: "docs/specs/page-match-fm (hérité de L160, inchangé et hors du périmètre des tests de L161)", obligatoire: false }
  - { id: classement-direct, libelle: "Classement en direct (L160)", type: carte, source: "docs/specs/page-match-fm (hérité de L160, inchangé et hors du périmètre des tests de L161)", obligatoire: false }

regles:
  - id: R1
    etat: charge
    enonce: "La liste des faits (sous l'en-tête du bloc et du repère de R3) est bornée à CINQ lignes de faits, pas à une hauteur en pixels. Chaque ligne de fait a une hauteur fixe, la variable --ligne-fait, qui dépend de la largeur. De 390 px à 1440 px (et au-delà) : 44 px, la grille habituelle gauche (OL) / minute / droite (adversaire), deux lignes de texte au plus à 14 px, interligne 1,2, soit 33,6 px, plus 4 px de remplissage haut et bas et le filet de 1 px, arrondi à 44 ; un libellé plus long est tronqué à deux lignes par une ellipse, le texte entier restant dans le DOM. Sous 390 px (390 exclu : 389 px et moins, jusqu'au reflow de 320 px, WCAG 1.4.10, qui est aussi le cas d'un zoom de 400 % sur un écran de 1280 px) : 60 px, sans aucune troncature, le nom d'un joueur n'étant jamais coupé : la ligne est empilée sur une seule colonne, `minute · équipe` (12 px, ex. « 81' · OL ») au-dessus du libellé (13 px, interligne 1,25, retour à la ligne libre, jusqu'à deux lignes : 15 + 2 + 2 x 16,25 + 8 de remplissage + 1 de filet = 58,5, arrondi à 60), les cellules vides de l'autre équipe étant masquées ; l'équipe se lit donc dans le texte de la minute et non plus par le côté de la grille. La borne s'écrit dans les deux cas max-height: calc(5 * var(--ligne-fait)), soit 220 px à 390 px et au-delà et 300 px sous 390 px (client height mesuré = 220 et 300 sur la maquette ; mesuré aussi à 389, 360 et 320 px), et la liste s'ouvre sur les 5 faits les plus récents (R2) ; au-delà, elle défile verticalement dans le bloc, à toutes les largeurs. Avec 18 faits le bloc passe de 833 px à 293 px (en-tête, repère de 32 px, liste de 220 px, bordures). Enveloppe réelle reproduite dans la maquette, mesurée sur ol.sladoire.dev (Lyon–Rennes, 20 faits) : à 1440 padding haut de 24 px (page large, py-6), en-tête du score 171 px, Momentum 231 px ; sous 1024 px, padding haut de 20 px, ligne de la pastille « LIVE CONNECTÉ » (app-shell.tsx, 25 px + 12 px de marge, le contenu commence à y = 57), barre de navigation fixe de 58 px en bas (de y = 786 à 844 à 390 x 844) et padding bas de 80 px (pb-20), en-tête du score de 251 px à 390 et de 267 px à 320. Mesure sur la maquette à 1440 x 900 (barre de défilement de page comprise) : le bloc Faits commence à y = 267, le Momentum à y = 576 et finit à 807 (au lieu de 1098 sans borne), donc entièrement au-dessus du pli de 900 px, et la carte des tirs commence à y = 823, titre visible sans défiler. À 390 x 844 : le bloc Faits commence à y = 380, le Momentum à y = 689 (au lieu de 1336 sans borne) : seuls 97 px de ses 186 sont visibles au-dessus de la barre du bas (qui commence à 786), le reste se découvre en faisant défiler la page d'un demi-écran ; la carte des tirs commence à y = 891, sous le pli, ce qui n'est pas exigé. À 320 x 700 (lignes de 60 px, bloc de 373 px, bloc Faits à y = 396) : Momentum à y = 785, hors de la vue (bas utile 642 au-dessus de la barre du bas), carte des tirs à y = 987 : à 320 px la borne n'a pour effet que de ramener le Momentum de plusieurs écrans à moins d'un écran de défilement, ce qui n'est pas exigé non plus. L'ordre des blocs ne change pas (décision de Sylvain)."
    message: ~
    champs: [faits-match, liste-faits, elan, carte-tirs]
    statut: sourcee
    source: "note du lot L161, décisions de Sylvain du 16-10 : « le bloc Faits du match garde une hauteur bornée avec une barre de défilement » et « CINQ faits visibles par défaut, le reste par défilement (la borne est la hauteur de 5 lignes, pas une hauteur en px) » ; la valeur de 44 px par ligne est mesurée sur la maquette (hypothèse R5)"
    tests: ["R1 — 18 faits à 1440 : la liste fait exactement 5 fois la hauteur d'une ligne de fait (client height = 5 × hauteur d'un .ev = 220 px) et défile (scrollHeight > clientHeight)", "R1 — 18 faits à 390 : même borne (220 px = 5 × 44 px), toutes les lignes de même hauteur, pas de défilement horizontal de la page", "R1 — 320 px : aucun libellé tronqué (scrollHeight = clientHeight sur chaque fait et sur chaque libellé), lignes de 60 px, 5 faits visibles (client height = 5 × 60 = 300 px), pas de défilement horizontal de la page", "R1 — 389 px : mêmes mesures qu'à 320 px (lignes de 60 px) ; 390 px : lignes de 44 px", "R1 — 5 lignes de faits sont entièrement visibles à l'ouverture, la sixième est hors de la vue", "R1 — à 1440 x 900 : le Momentum finit au-dessus de 900 px (y = 576 à 807) et la carte des tirs commence au-dessus de 900 px (y = 823)", "R1 — à 390 x 844 : le Momentum commence au-dessus de la barre du bas (y = 689 < 786), la carte des tirs est sous le pli"]
  - id: R2
    etat: charge
    enonce: "La liste s'ouvre sur les faits les plus récents : l'ordre chronologique reste (plus ancien en haut, plus récent en bas) et la liste est positionnée en bas ; les 5 derniers faits (ici 81' à 90+4') sont visibles à l'ouverture et on remonte pour lire les plus anciens. Un nouveau fait d'un match en direct reste visible tant que le lecteur n'a pas remonté la liste."
    message: ~
    champs: [liste-faits]
    statut: sourcee
    source: "note du lot L161 : « n'affiche par défaut que les événements les plus récents (défilé en bas, ou les plus récents en tête) » ; choix « défilé en bas » : hypothèse R5"
    tests: ["R2 — 18 faits : le dernier fait (90+4') est visible à l'ouverture, les 5 derniers faits sont les 5 lignes visibles", "R2 — l'ordre du DOM reste chronologique"]
  - id: R3
    etat: charge
    enonce: "L'en-tête du bloc porte le nombre de faits (« 18 faits »). Sous l'en-tête, tant que la liste déborde, une ligne de repère de 32 px, qui est un bouton, dit combien de faits sont hors de la vue en haut : « ↑ 13 faits plus anciens » (flèche masquée aux lecteurs d'écran ; « 1 fait plus ancien » au singulier). N = nombre de faits entièrement au-dessus du bord haut de la liste, recalculé à chaque défilement ; N = 0 (liste tout en haut) donne « Début du match » sans flèche, et le bouton devient inactif : aria-disabled=\"true\", curseur par défaut, plus de survol, et un clic ou Entrée ne fait rien. Il reste un bouton focusable (convention des boutons inactifs de WAI-ARIA : le focus n'est pas perdu quand le dernier clic ramène la liste en butée) et son anneau de focus de R11 reste visible. La ligne garde sa hauteur dans tous les cas de défilement (pas de saut de mise en page). Hors N = 0, un clic ou Entrée sur le bouton remonte la liste d'une hauteur de liste (5 faits ; 300 px sous 390 px, 220 px au-delà). La ligne n'est pas annoncée au fil du défilement (pas de région live). Texte --fg-muted sur le fond du repère : 7,11:1 mesuré (WCAG 1.4.3 exige 4,5:1). Ce repère remplace l'ombre de la première maquette (1,06:1, invisible) ; il est indispensable au téléphone et sous macOS, où la barre de défilement est masquée tant qu'on ne défile pas, et la borne tombant juste sur 5 lignes aucune ligne coupée ne trahit la suite."
    message: "13 faits plus anciens"
    champs: [compte-faits, repere-faits-anciens, liste-faits]
    statut: hypothese
    si_faux: "Si le repère est jugé superflu ou préféré en fondu du contenu (mask-image sur 24 px), on le remplace : la borne et le défilement (R1, R2, R10) restent valables ; aucune donnée en jeu. Le compteur de l'en-tête reste."
    tests: ["R3 — le compteur de l'en-tête affiche le nombre d'événements", "R3 — 18 faits : le repère dit « 13 faits plus anciens » ; 6 faits : « 1 fait plus ancien »", "R3 — liste remontée tout en haut : le repère dit « Début du match », garde la même hauteur, porte aria-disabled=\"true\" et un clic ne fait pas défiler", "R3 — un clic sur le repère remonte la liste de 5 faits", "R3 — le repère est un bouton, hors de la zone défilante, de contraste texte >= 4,5:1"]
  - id: R4
    etat: peu-de-faits
    enonce: "Avec 5 faits ou moins (5 sur la maquette), la liste tient dans la borne de 5 lignes : le bloc garde sa hauteur naturelle, sans barre de défilement et sans ligne de repère ; la liste n'est alors ni focusable ni une région (pas de tabindex, pas de role, pas d'aria-label : rien à défiler, R11) et le compteur dit « 5 faits ». Dès 6 faits la liste défile, le repère dit « 1 fait plus ancien » et le tabindex apparaît."
    message: "5 faits"
    champs: [faits-match, compte-faits, liste-faits]
    statut: sourcee
    source: "comportement de la borne de R1 (max-height, pas height) ; pas de fait : le bloc n'est pas affiché (L160 R3) ; constat de la revue de la maquette (tabulation inutile sur une liste qui ne défile pas)"
    tests: ["R4 — 5 faits : hauteur de la liste = 5 lignes, scrollHeight = clientHeight, pas de repère", "R4 — 5 faits : la liste n'a ni tabindex ni role region", "R4 — 6 faits : la liste défile, le repère dit « 1 fait plus ancien » et la liste a tabindex 0"]
  - id: R5
    etat: charge
    enonce: "Choix de mise en oeuvre de la maquette : hauteur de ligne fixe, 44 px de 390 px à 1440 px et 60 px sous 390 px (R1), départ en bas par flex-direction column-reverse sans JavaScript de défilement ; la borne reste exprimée en lignes (calc(5 * var(--ligne-fait))). La maquette est statique, sans script : le repère de R3 y montre l'état initial (« 13 faits plus anciens ») et ne se recalcule pas ; son recalcul à chaque défilement, ses variantes (« 1 fait plus ancien », « Début du match » inactif) et son clic sont décrits par R3 et R11 et vérifiés par leurs tests dans l'application."
    message: ~
    champs: [liste-faits, repere-faits-anciens]
    statut: hypothese
    si_faux: "Si une hauteur de ligne doit être autre (ligne à hauteur libre, mesurée par JavaScript) ou le départ en bas posé par scrollTop, seule une valeur ou une technique change ; les décisions de Sylvain (5 faits visibles, bloc borné et défilant) restent vraies."
    tests: ["R5 — la variable --ligne-fait vaut 44 px à 1440 et à 390 et 60 px à 389, 360 et 320, et la max-height de la liste vaut 5 fois cette valeur"]
  - id: R6
    etat: charge
    enonce: "Rien d'autre ne change : ordre des blocs du centre (Faits, Momentum, Carte des tirs, Statistiques), contenu et libellés des lignes de faits, couleurs, compositions et statistiques latérales (champs hérités de L160 listés plus haut) et appel API (GET /api/live-match/{gameId}/stats, aucun champ ajouté)."
    message: ~
    champs: [entete-score, grille-match, colonne-centre, bloc-statistiques, bloc-composition, titre-composition, formation-composition, terrain-composition, rangee-composition, banc-composition, stats-equipe-domicile, stats-equipe-visiteur, colonne-centre-bas, joueurs-en-vue, classement-direct]
    statut: sourcee
    source: "note du lot L161 : « l'ordre des blocs du centre ne change pas » ; docs/specs/page-match-fm R8 et R11"
    tests: ["R6 — l'ordre des blocs du centre est inchangé", "R6 — un seul appel /api/live-match/{gameId}/stats"]
  - id: R7
    etat: chargement
    enonce: "Pendant le chargement, le message d'attente existant s'affiche, sans grille."
    message: "Chargement du match…"
    champs: [message-chargement]
    statut: sourcee
    source: "docs/specs/page-match-fm R1 (inchangé)"
    tests: ["R7 — chargement : message, aucun bloc"]
  - id: R8
    etat: erreur
    enonce: "Si le match ne se charge pas, l'erreur existante s'affiche avec un lien de retour."
    message: "Match introuvable"
    champs: [message-erreur]
    statut: sourcee
    source: "docs/specs/page-match-fm R2 (inchangé)"
    tests: ["R8 — erreur : message, aucun bloc"]
  - id: R9
    etat: vide
    enonce: "Sans fait, le bloc Faits du match n'est pas affiché ; le bloc Statistiques annonce l'absence de chiffres."
    message: "Pas encore de statistiques."
    champs: [entete-score, grille-match, colonne-centre, bloc-statistiques, message-stats-vide]
    masque: [faits-match, compte-faits, liste-faits, elan, carte-tirs]
    statut: sourcee
    source: "docs/specs/page-match-fm R3 (inchangé) ; match.tsx : events.length > 0"
    tests: ["R9 — vide : aucun bloc Faits, message de statistiques"]
  - id: R10
    etat: charge
    enonce: "Le défilement de la liste ne piège ni la molette ni le balayage : overscroll-behavior garde sa valeur par défaut (auto), jamais contain ni none. Liste ouverte en bas (état initial), un défilement vers le bas commencé sur la liste fait défiler la page tout de suite ; un défilement vers le haut remonte la liste ; arrivée en butée haute, un défilement vers le haut passe à la page. Mesuré sur la maquette à 1440 (Playwright) : molette +400 sur la liste ouverte, la page passe de 0 à 440 ; liste remontée en butée, molette -300, la page passe de 500 à 200 ; au tactile à 390 (balayage simulé), le doigt qui monte sur la liste ouverte fait défiler la page de 24 à 199, le doigt qui descend fait remonter la liste (scrollTop 0 à -126). Un même geste continu commencé sur la liste y reste jusqu'au relâchement (comportement du navigateur) : c'est la butée qui passe la main au geste suivant."
    message: ~
    champs: [liste-faits]
    statut: sourcee
    source: "revue de la maquette (majeur : la molette et le balayage restaient bloqués sur la liste ; Nielsen n° 3 contrôle et liberté, n° 4 convention de la plateforme)"
    tests: ["R10 — la liste n'a pas d'overscroll-behavior contain ni none", "R10 — souris au centre de la liste ouverte, molette vers le bas : la page défile (scrollY > 0)", "R10 — liste en butée haute, molette vers le haut : la page remonte"]
  - id: R11
    etat: charge
    enonce: "Au clavier, quand la liste déborde : elle est focusable (tabindex 0), porte role region et aria-label « Faits du match, du plus ancien au plus récent », et son anneau de focus visible est un contour de 2 px en --ol-red-bright (la convention de focus du site, 4,95:1 sur --surface), décalé de -2 px vers l'intérieur pour ne pas être rogné par le bloc. Les flèches, Page précédente / suivante, Début et Fin la font défiler (comportement natif, vérifié : Début va au plus ancien, Fin au plus récent). Le bouton du repère (R3) est l'autre arrêt de tabulation et porte le même anneau, y compris inactif (« Début du match », aria-disabled). Quand la liste ne déborde pas, ni l'un ni l'autre (R4)."
    message: ~
    champs: [liste-faits, repere-faits-anciens]
    statut: sourcee
    source: "revue de la maquette (mineur : tabindex sur une liste sans défilement) ; WCAG 2.1.1, 2.4.7 et 2.4.11 ; note du lot L161 (la barre et le focus doivent être aux couleurs du site)"
    tests: ["R11 — la liste qui déborde a tabindex 0, role region et un nom accessible", "R11 — au focus clavier, contour de 2 px en --ol-red-bright", "R11 — Fin puis Début au clavier font défiler la liste"]
  - id: R12
    etat: charge
    enonce: "La barre de défilement de la liste est fine, sobre et sans flèches (décision de Sylvain du 16-10, après l'avoir vue sur l'app : la barre bleue et rouge à flèches faisait « années 80 »). Largeur 10 px (::-webkit-scrollbar, plage voulue 8 à 10 px) ; piste de la couleur de la surface du bloc, --surface hsl(228 21% 8%) (#101219) ; curseur arrondi (rayon 5 px) dont l'intérieur est noir, --bg hsl(232 25% 5%) (#0a0a10, le jeton le plus sombre du site), cerné d'une bordure de 1 px --ol-red hsl(0 73% 50%) (#dd2222). Au survol du curseur, un léger halo rouge : box-shadow du rouge néon du site, 0 0 6px 1px hsl(0 95% 60% / 0,7) (même teinte que le premier cran du néon de R13), avec une ombre intérieure de même teinte. AUCUN bouton fléché : ::-webkit-scrollbar-button { display: none }. Contraste de la bordure du curseur sur la piste : 3,85:1 calculé (--ol-red sur --surface), donc au moins 3:1 (WCAG 1.4.11) ; l'intérieur noir du curseur sur la piste (1,05:1) n'est pas exigé, c'est la bordure rouge qui identifie le composant. La bordure néon du bloc (R13) ne change pas. Moteurs : WebKit et Chrome (::-webkit-scrollbar) portent le rendu complet ci-dessus. Pour Firefox, qui ne connaît pas ::-webkit-scrollbar et ne sait pas dessiner une bordure de curseur, la même feuille déclare, sous @supports not selector(::-webkit-scrollbar), scrollbar-width: thin et scrollbar-color: hsl(232 25% 5%) hsl(228 21% 8%) (curseur --bg, piste --surface) ; cette déclaration n'est PAS posée pour Chrome 121+ et Safari 18.2+, qui, en la voyant, ignoreraient ::-webkit-scrollbar et perdraient la bordure rouge. Au téléphone et sous macOS la barre est masquée tant qu'on ne défile pas : le repère de R3 porte alors seul l'information."
    message: ~
    champs: [liste-faits]
    statut: sourcee
    source: "note du lot L161, décisions de Sylvain du 16-10 : « barre de défilement aux couleurs du site (...) curseur >= 3:1 sur la piste (WCAG 1.4.11) » puis, vu sur l'app locale, « la barre bleue/rouge avec flèches fait années 80 ; nouveau style = barre fine 8–10 px, piste de la couleur du fond du bloc, curseur arrondi NOIR à bordure rouge 1 px, léger halo rouge au survol, PAS de flèches ; la bordure néon du bloc reste » ; jamais de vert"
    tests: ["R12 — la barre est fine (8 à 10 px), piste --surface, curseur --bg à bordure 1 px --ol-red, sans bouton fléché, halo rouge au survol, scrollbar-color + scrollbar-width thin pour Firefox", "R12 — contraste de la bordure du curseur sur la piste >= 3:1 calculé depuis les deux couleurs"]
  - id: R13
    etat: charge
    enonce: "Le bloc Faits du match porte la bordure néon du site, rouge en haut et bleu en bas. Bordure de 1 px en dégradé vertical hsl(0 95% 65% / 0,95), hsl(0 90% 60% / 0,7) à 35 %, hsl(224 90% 60% / 0,7) à 65 %, hsl(224 95% 65% / 0,95) (mêmes teintes que les bords néon de la barre latérale, sidebar.tsx, et des filets du corps, index.css body::before et body::after), sur le fond --surface. Halo : les trois ombres des bords néon de la barre latérale, 0 0 8px 0.5px hsl(0 95% 60% / 0,7), 0 0 18px 1px hsl(0 95% 55% / 0,45), 0 0 36px 2px hsl(0 90% 50% / 0,2), et leurs trois équivalents bleus à la teinte 224 (hsl(224 95% 60% / 0,7), hsl(224 95% 55% / 0,45), hsl(224 90% 50% / 0,2)) ; rayons et étalements inchangés, seul un décalage vertical de 2, 4 et 8 px envoie le rouge vers le haut et le bleu vers le bas. Le bloc n'est donc plus en overflow: hidden. Contraste des deux extrémités de la bordure sur --surface : 5,69:1 (rouge) et 5,11:1 (bleu). Mode contraste forcé : bordure en CanvasText. Aucun vert."
    message: ~
