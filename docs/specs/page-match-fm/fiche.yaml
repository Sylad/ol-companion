ecran:
  id: page-match-fm
  titre: Page du match disposée comme un écran de match de Football Manager
  route: /match/$gameId
  lot: L186
  largeurs: [1440, 390]
  maquette: docs/specs/page-match-fm/maquette.html
etats: [vide, chargement, erreur, charge, exterieur, probable, probable-mixte]

champs:
  - { id: message-chargement, libelle: Message de chargement, type: texte, source: statique, obligatoire: true }
  - { id: message-erreur, libelle: Message d'erreur de la page, type: texte, source: statique, obligatoire: true }
  - { id: message-stats-vide, libelle: Message sans statistiques, type: texte, source: statique, obligatoire: false }
  - { id: entete-score, libelle: En-tête du score (statut, compétition, horloge, clubs, score, buteurs), type: carte, source: "GET /api/live-match/{gameId}/stats → status, competitionName, home, away, events", obligatoire: true }
  - { id: grille-match, libelle: Grille à trois colonnes fixes à partir de 1440 px, type: liste, source: statique, obligatoire: true }
  - { id: colonne-centre, libelle: Colonne centrale unique (faits, rangée statistiques-momentum, rangée tirs-joueurs), type: liste, source: "GET /api/live-match/{gameId}/stats", obligatoire: true }
  - { id: rangee-stats-elan, libelle: Rangée Statistiques comparées et Momentum côte à côte (même hauteur), type: liste, source: "GET /api/live-match/{gameId}/stats → teamStats, momentum", obligatoire: true }
  - { id: rangee-tirs-joueurs, libelle: Rangée Carte des tirs et pile Joueurs en vue / Classement en direct, type: liste, source: "GET /api/live-match/{gameId}/stats → shots, topPerformers, standings", obligatoire: false }
  - { id: colonne-centre-bas, libelle: Pile à droite de la carte des tirs (joueurs en vue puis classement), type: liste, source: "GET /api/live-match/{gameId}/stats → topPerformers, standings", obligatoire: false }
  - { id: bloc-composition, libelle: Bloc Composition d'une équipe, type: carte, source: "GET /api/live-match/{gameId}/stats → lineups", obligatoire: false }
  - { id: titre-composition, libelle: Titre « Composition · club », type: texte, source: "GET /api/live-match/{gameId}/stats → équipe", obligatoire: false }
  - { id: formation-composition, libelle: Pastille de la formation, type: texte, source: "GET /api/live-match/{gameId}/stats → lineup.formation", obligatoire: false }
  - { id: terrain-composition, libelle: Terrain de hauteur fixe portant les rangées, type: carte, source: "GET /api/live-match/{gameId}/stats → lineup.starters", obligatoire: false }
  - { id: rangee-composition, libelle: Rangée de joueurs, type: ligne, source: "GET /api/live-match/{gameId}/stats → lineup.starters", obligatoire: false }
  - { id: banc-composition, libelle: Banc sur une ligne, type: texte, source: "GET /api/live-match/{gameId}/stats → lineup.bench", obligatoire: false }
  - { id: stats-equipe-domicile, libelle: Statistiques de l'équipe à domicile (valeurs seules), type: carte, source: "GET /api/live-match/{gameId}/stats → teamStats.home", obligatoire: false }
  - { id: stats-equipe-visiteur, libelle: Statistiques de l'équipe visiteuse (valeurs seules), type: carte, source: "GET /api/live-match/{gameId}/stats → teamStats.away", obligatoire: false }
  - { id: faits-match, libelle: Faits du match, type: liste, source: "GET /api/live-match/{gameId}/stats → events", obligatoire: false }
  - { id: elan, libelle: Momentum (barres par minute, légende des clubs, légende de direction), type: carte, source: "GET /api/live-match/{gameId}/stats → momentum", obligatoire: false }
  - { id: bande-reservee, libelle: Bande de 24 px réservée (vide) dans une composition confirmée voisine d'une probable, type: texte, source: statique, obligatoire: false }
  - { id: etiquette-probable, libelle: Étiquette « Composition probable », type: texte, source: "GET /api/live-match/{gameId}/stats → lineups.probable", obligatoire: false }
  - { id: carte-tirs, libelle: Carte des tirs (terrain à la verticale), type: carte, source: "GET /api/live-match/{gameId}/stats → shots", obligatoire: false }
  - { id: bloc-statistiques, libelle: Statistiques comparées (barres), type: carte, source: "GET /api/live-match/{gameId}/stats → teamStats", obligatoire: true }
  - { id: joueurs-en-vue, libelle: Joueurs en vue, type: carte, source: "GET /api/live-match/{gameId}/stats → topPerformers", obligatoire: false }
  - { id: coup-envoi, libelle: Coup d'envoi d'un match à venir (date courte et heure, ou « Horaire à confirmer »), type: texte, source: "GET /api/live-match/{gameId}/stats → startTime, timeConfirmed", obligatoire: false }
  - { id: message-joueurs-en-vue-vide, libelle: Message d'état vide de Joueurs en vue (match à venir sans chiffres), type: texte, source: statique, obligatoire: false }
  - { id: periode-joueurs-en-vue, libelle: Mention de période des chiffres de Joueurs en vue (match à venir), type: texte, source: statique, obligatoire: false }
  - { id: classement-direct, libelle: Classement en direct, type: carte, source: "GET /api/live-match/{gameId}/stats → standings", obligatoire: false }

regles:
  - id: R1
    etat: chargement
    enonce: Pendant le chargement, la page affiche le message d'attente existant, sans grille et sans squelette (aucun squelette n'est ajouté par le lot).
    message: "Chargement du match…"
    champs: [message-chargement]
    statut: sourcee
    source: "frontend/src/routes/match.tsx (isLoading) ; état inchangé par le lot"
    tests: ["R1 — chargement : message, aucune colonne"]
  - id: R2
    etat: erreur
    enonce: Si le match ne se charge pas, la page affiche l'erreur existante et un lien de retour, sans grille.
    message: "Match introuvable"
    champs: [message-erreur]
    statut: sourcee
    source: "frontend/src/routes/match.tsx (isError) ; texte inchangé. Couleur : jeton --loss-fg (hsl 0 84% 63%, frontend/src/index.css:30, créé en L138, 5,36:1 sur le panneau --surface, 5,64:1 sur --bg), classe text-loss-fg, jamais text-loss (3,85:1 sur le panneau, sous 4,5:1, WCAG 1.4.3) — revue UX de la maquette"
    tests: ["R2 — erreur : message, aucune colonne", "R2 — le message d'erreur porte la classe text-loss-fg (contraste ≥ 4,5:1)"]
  - id: R3
    etat: vide
    enonce: "Sans composition publiée, ni fait, tir ou momentum (match à venir sans composition même probable), l'en-tête reste, les blocs absents ne s'affichent pas (aucun cadre vide), les colonnes latérales sont vides et le centre garde sa largeur ; le bloc Statistiques annonce l'absence de chiffres. Le centre affiche chaque bloc dont les données existent : Statistiques est le seul bloc garanti, et Joueurs en vue et Classement en direct s'affichent dès que topPerformers et standings existent, y compris avant le coup d'envoi (les données réelles d'un match à venir en portent déjà) ; le masque ci-dessous décrit le cas où ces données sont absentes. L'en-tête d'un match à venir affiche « À venir », la compétition, « vs » à la place du score et l'horloge « À VENIR », et, à droite de l'en-tête (champ coup-envoi, devant l'horloge), la date courte et l'heure du coup d'envoi (« Jeu. 22/10 · 21h00 », comme la page de match des Bleus depuis L168), ou, quand timeConfirmed est faux, le jour non ferme de L47 suivi de « Horaire à confirmer », comme le calendrier (unconfirmedDay de lib/kickoff.ts : « Week-end du 24/10 · Horaire à confirmer » pour une date de remplissage du vendredi au dimanche, « Date et horaire à confirmer » un autre jour), jamais la date de remplissage présentée comme ferme (L172). Sur un match à venir, le bloc Joueurs en vue ne disparaît jamais en silence : il n'est plus dans le masque, et quand topPerformers est vide il s'affiche, en pleine largeur du centre faute de carte des tirs (R18), avec l'état vide « Les joueurs en vue apparaîtront avec les statistiques du match. » (message-joueurs-en-vue-vide, L173, match.tsx:630) ; avec des chiffres, il porte la mention « Chiffres de la saison avant le coup d’envoi, pas de ce match. » (periode-joueurs-en-vue) ; sur un match terminé, il reste dans le masque et disparaît quand topPerformers est vide (L173)."
    message: "Pas encore de statistiques."
    champs: [entete-score, coup-envoi, grille-match, colonne-centre, bloc-statistiques, message-stats-vide, rangee-tirs-joueurs, colonne-centre-bas, joueurs-en-vue, message-joueurs-en-vue-vide]
    masque: [bloc-composition, stats-equipe-domicile, stats-equipe-visiteur, faits-match, elan, carte-tirs, classement-direct]
    statut: sourcee
    source: "match.tsx (blocs conditionnés à leurs données, message « Pas encore de statistiques. » de statRows ; en-tête : isUpcoming, deriveClock → « À VENIR », MatchScore → « vs ») ; amendée le 17-10 sur décision du lead (cohérence avec la carte de /cups et la page des Bleus, Nielsen n° 1 et n° 4) : date et heure du coup d'envoi d'un match à venir ou « Horaire à confirmer » (L172), Joueurs en vue avec état vide sur un match à venir (L173) ; précisée le 17-10 au soir (question de la vague 2026-10-18-ol-cad) : sans horaire fixé, le jour suit la règle L47 du calendrier (CLAUDE.md « Jour non fixé ») ; docs/specs/composition-match R3 : « sans composition publiée, son bloc n'est pas affiché »"
    tests: ["R3 — vide : en-tête et message, aucun bloc absent, centre à la même largeur qu'avec données", "R3 — à venir : coup d'envoi dans l'en-tête, Joueurs en vue avec son message d'état vide"]
  - id: R4
    etat: charge
    enonce: "À partir de 1440 px de fenêtre (seuil `min-[1440px]`, pas xl), la page est une grille fixe de trois colonnes INDÉPENDANTES, chacune une pile verticale de ses propres blocs avec un écart uniforme de 16 px, sans rangée commune d'une colonne à l'autre : équipe à domicile à gauche (composition puis statistiques d'équipe), match au centre, équipe visiteuse à droite (composition puis statistiques d'équipe) ; colonnes latérales 280 px, centre = le reste, gouttière de 16 px entre colonnes (les bordures ne se touchent jamais). Enveloppe réelle de l'app (app-shell.tsx:29-30) : barre latérale de 240 px et marge de 32 px de chaque côté, donc à 1440 le contenu fait 1136 px et le centre 544 px (264 px par demi-rangée, voir R16 et R18) ; entre lg et 1439 px la page reste empilée (R10). Depuis L186 le centre est UNE colonne (une seule enveloppe, plus de centre haut / centre bas coupés par les côtés) : Faits du match, puis la rangée Statistiques | Momentum (R16), puis la rangée Carte des tirs | pile Joueurs en vue + Classement en direct (R17, R18). Un bloc du centre sans donnée n'est pas affiché et le suivant remonte : jamais de trou, quel que soit l'état ; une rangée qui n'a plus qu'un bloc le laisse occuper toute la largeur du centre. Aucune colonne ne s'étire à la hauteur d'une autre (align-items: start) : la hauteur d'un côté ne déplace aucun bloc du centre, ni l'inverse (seul l'étirement à même hauteur de R16, à l'intérieur de la rangée Statistiques | Momentum, est voulu). Les côtés forment UN élément (grille à deux rangées, compositions puis statistiques d'équipe) posé sur la rangée de la grille, qui laisse passer la souris sur le centre. Les deux compositions partagent la rangée 1 des côtés (même hauteur, étirées de moins d'une ligne de banc) et les deux blocs de statistiques d'équipe commencent à la même ordonnée, sous les compositions ; les terrains gardent la même hauteur fixe (R6). BalancedColumns et balanceColumns ne sont plus utilisés par la page."
    message: ~
    champs: [grille-match, colonne-centre, rangee-stats-elan, rangee-tirs-joueurs, colonne-centre-bas]
    statut: sourcee
    source: "demande du lot L160 : « disposition fixe à 1440 », « domicile à gauche, visiteur à droite » ; capture FM27 docs/specs/page-match-fm/reference-fm27.webp ; amendée par L186 (demande de Sylvain du 18-10 : centre en une colonne, Statistiques et Momentum côte à côte, carte des tirs à côté de Joueurs en vue et Classement) ; largeur 320 px : hypothèse R10"
    tests: ["R4 — 1440 dans l'enveloppe de l'app (barre 240 px + marges 32 px) : trois colonnes, domicile à gauche, visiteur à droite, centre au milieu", "R4 — 1440 : les deux blocs de statistiques d'équipe commencent à la même ordonnée (±1 px) et les deux compositions ont la même hauteur (±1 px), même si un banc tient sur deux lignes et l'autre sur une", "R4 — 1440 : gouttière de 16 px entre les colonnes (bord droit d'une colonne + 16 = bord gauche de la suivante, ±1 px), centre ≥ 480 px", "R4 — 1439 : empilement une colonne, pas de trois colonnes", "R4 — 1440 : un bloc qui grandit ne change pas de colonne", "R4 — aucun trou : dans le centre, chaque rangée commence à (bas de la précédente + 16 px) ±1 px, quel que soit l'état (charge complet, sans carte des tirs, sans tirs ni Momentum, sans faits ni tirs, sans joueurs en vue ni classement)", "R4 — état à venir : la colonne centrale ne laisse pas de vide au-dessus du premier bloc présent (le haut du premier bloc est le haut de la grille, ±1 px), avec ou sans compositions probables", "R4 — 1440 : les colonnes sont indépendantes (agrandir un bloc latéral ne déplace aucun bloc du centre ; masquer un bloc du centre ne déplace aucun bloc latéral)", "R4 — 1440×900 : le début des statistiques d'équipe est visible sans défiler et aucun panneau latéral n'a plus de 15 % de vide", "R4 — 1440×900 : Statistiques et Momentum sont entièrement visibles sans défiler (bas des deux blocs ≤ 900 px)", "R4 — BalancedColumns n'est plus importé par match.tsx"]
  - id: R5
    etat: charge
    enonce: "Chaque côté porte sa composition puis ses statistiques d'équipe : colonne de gauche = équipe à domicile (data.home), colonne de droite = équipe visiteuse (data.away), que ce soit l'OL ou non. Une seule règle de couleur pour tout ce qui porte une équipe : la couleur suit le CLUB, pas le côté (OL toujours rouge, adversaire toujours bleu), que l'OL joue à domicile ou à l'extérieur, avec la même teinte pour un même club dans tous les blocs. (a) Éléments graphiques (barres comparées, barres et pastilles de but du Momentum, points et marqueurs de la carte des tirs, pastilles de légende des clubs) : OL = --ol-red (hsl 0 73% 50%, 3,85:1 sur --surface), adversaire = --ol-blue-bright (hsl 226 56% 51%, 3,20:1 sur --surface, 3,10:1 sur le fond du terrain de la carte des tirs), opacité 1 partout (WCAG 1.4.11 : 3:1 ; à l'opacité 0,85 du composant actuel le bleu tombe à 2,63:1, et --ol-blue, 1,83:1 sur --surface, est interdit pour un élément graphique). Calcul : luminance relative WCAG 2.x L = 0,2126 R + 0,7152 G + 0,0722 B (R, G, B linéarisés), rapport (L1 + 0,05) / (L2 + 0,05), --surface = hsl 228 21% 8%. (b) Texte qui porte une équipe (libellés « ↓ RCL attaque » / « OL attaque ↑ » de la carte des tirs (L186), numéros de pastille de composition) : OL = --ol-red-bright (4,95:1), adversaire = hsl(226 70% 70%) (6,59:1), WCAG 1.4.3 (4,5:1) ; le libellé actuel, text-ol-blue en 9 px à 1,83:1, est corrigé. (c) Composition (bordure de pastille, pastille de formation) : tokens de docs/specs/composition-match inchangés, décoratifs (le nom et le numéro portent le sens). Le Momentum se dessine comme le composant actuel (momentum-chart.tsx) : barres vers le haut pour l'équipe à domicile, vers le bas pour la visiteuse, pastille de but (rond cerclé de blanc) sur la barre de la minute du but, chacune à la couleur de son club ; légende aux noms des clubs (domicile puis visiteur), légende de direction « Vers le haut : <domicile>, vers le bas : <visiteur>. » et équivalent textuel (role=\"img\", aria-label « Momentum »). Carte des tirs : légende des clubs « symbole + nom » (OL Lyon, RCL Lens), un point par tir (forme par issue : rond plein = cadré, rond plein cerclé de blanc avec halo = but, croix = bloqué, rond vide = manqué ; taille = xG), légende des issues en gris neutre (elle ne porte aucun club), fond du terrain neutre (--surface-2 à 50 %) et non le rgba(20,32,28,0.5) actuel, légèrement vert (CLAUDE.md : pas de vert décoratif). L'implémentation applique les mêmes couleurs aux vrais MomentumChart et ShotMap quand ils sont placés dans la nouvelle disposition : MomentumChart passe de --ol-blue à --ol-blue-bright, de l'opacité 0,85 à 1 et de la couleur par côté à la couleur par club (pastilles de but comprises) ; ShotMap passe de la couleur par côté à la couleur par club, de --ol-blue à --ol-blue-bright, de #62a8e3 à la teinte du club pour les contours, et colore ses libellés d'attaque comme en (b) ; StatRow (barres comparées) passe de --ol-blue à --ol-blue-bright, avec un séparateur de 2 px de la couleur de --surface entre les deux segments. Variante « OL à l'extérieur » montrée dans #etat-exterieur. Sigle d'un club (carte des tirs, faits du match) : « OL » fixe pour le club suivi (jamais « LYO »), le sigle de 365scores pour l'adversaire et, quand 365scores le renvoie vide, les trois premières lettres du nom en capitales (« REN »). Légende de la carte des tirs « sigle + nom » ; quand le sigle n'est qu'un repli tiré du nom, elle se réduit au nom (« Rennes », pas « REN Rennes »). Libellés d'attaque de la carte des tirs : une ligne horizontale sous la surface de jeu, « ↓ <visiteur> attaque » à gauche et « <domicile> attaque ↑ » à droite (terrain à la verticale depuis L186 : le club à domicile attaque vers le haut, R17), jamais posés sur le terrain (les tirs se concentrent dans les surfaces : posés dessus, ils se recouvrent, contraste mesuré 1,28:1) ; la maquette les montre ainsi."
    message: ~
    champs: [bloc-composition, titre-composition, formation-composition, rangee-composition, banc-composition, stats-equipe-domicile, stats-equipe-visiteur, elan, carte-tirs, bloc-statistiques]
    statut: sourcee
    source: "demande du lot L160 : « chaque équipe a son côté (domicile à gauche, visiteur à droite) avec sa composition et ses statistiques d'équipe » ; couleur par club : lineup-card.tsx (accent red|blue suit l'OL), CLAUDE.md palette stricte rouge + bleu OL (OL rouge, marqueur OL de la carte rouge, pas de vert décoratif). Étendre cette règle aux barres, tirs et élan (aujourd'hui par côté dans StatRow, ShotMap, MomentumChart) et changer le bleu des éléments graphiques sont des choix de la revue UX : changement de présentation seul, aucune donnée. Contrastes calculés le 2026-10-16 par luminance relative : rouge 3,85:1, bleu 3,20:1 sur --surface ; constats de la revue UX de la maquette sur momentum-chart.tsx:12 (opacité 0,85) et shot-map.tsx:45-49. Décisions du lot prises à la revue de conformité du 2026-10-16, après le scellement : sigle « OL » fixe et repli sur les trois premières lettres du nom (symbolicName de 365scores souvent vide, « LYO » affiché à tort), légende réduite au nom quand le sigle n'est qu'un repli, libellés d'attaque sortis du terrain (contraste mesuré à 1,28:1 en commit e35881a quand ils étaient posés sur les surfaces)"
    tests: ["R5 — OL à domicile : OL à gauche, accent rouge", "R5 — OL en déplacement : OL à droite en rouge, adversaire à gauche en bleu, et barres, points de tirs et barres du Momentum de l'OL en rouge", "R5 — Momentum : barres vers le haut (domicile) et vers le bas (visiteur) à la couleur du club, légende des noms puis « Vers le haut : X, vers le bas : Y », aria-label « Momentum »", "R5 — contraste : les barres du Momentum, les barres comparées et les marqueurs de la carte des tirs mesurent au moins 3:1 sur --surface (rouge OL et bleu adverse, opacité 1) ; les libellés d'attaque et numéros de pastille au moins 4,5:1", "R5 — un même club a la même teinte dans les barres comparées, le Momentum, la carte des tirs et leurs légendes (OL à domicile, puis à l'extérieur)", "R5 — chaque côté contient sa composition puis ses statistiques", "R5 — l'ordre du DOM est celui de R10", "R5 — sous chaque minute : « OL » pour le club suivi (jamais « LYO »), le repli « REN » pour l'adversaire", "R5 — sans sigle de 365scores : « OL Lyon · Rennes », pas « LYO LYON · REN RENNES »", "R5 — avec un vrai sigle adverse, la légende garde « RCL Lens »", "R5 — les libellés d'attaque ne sont pas posés sur le terrain : ni dans son conteneur, ni en position absolue", "R5 — les libellés sont du texte horizontal, sur une seule ligne, sous le terrain", "R5 — la couleur suit le club (OL rouge, adversaire bleu) et reste ≥ 4,5:1, OL à domicile comme à l'extérieur"]

  - id: R6
    etat: charge
    enonce: "Les deux terrains de composition ont la même hauteur quelle que soit la formation (4-2-3-1 à 5 rangées, 4-4-2 à 4 rangées) : les rangées se répartissent verticalement dans cette hauteur fixe. Les rangées, pastilles, repli « formation inconnue » et banc restent ceux de docs/specs/composition-match (R4 à R8), y compris la réduction de police des noms longs (fitNameFont, lineup-card.tsx) que la maquette ne reproduit pas : à 320-390 px, Frankowski, Lacazette et Tessmann y débordent de leur pastille, ce qui n'est pas à reprendre."
    message: ~
    champs: [terrain-composition, rangee-composition, bloc-composition]
    statut: sourcee
    source: "demande du lot L160 : « les deux compositions ont le même gabarit (même hauteur de terrain quelle que soit la formation) pour un alignement propre »"
    tests: ["R6 — 4-2-3-1 contre 4-4-2 : terrains de même hauteur ±1 px", "R6 — 4-2-3-1 contre formation inconnue : même hauteur", "R6 — les 11 titulaires restent visibles dans la hauteur fixe à 1440 et à 390"]
  - id: R7
    etat: charge
    enonce: "La hauteur du terrain est de 360 px à toute largeur, les rangées étant espacées de façon égale (justify-content: space-around)."
    message: ~
    champs: [terrain-composition]
    statut: hypothese
    si_faux: "Si la hauteur doit être autre (320, 400 px) ou suivre la largeur, seule la valeur du gabarit change ; R6 (égalité des deux terrains) reste vraie."
    tests: ["R7 — hauteur du terrain 360 px à 1440 et à 390"]
  - id: R8
    etat: charge
    enonce: "Le centre empile, dans l'ordre : Faits du match, puis la rangée Statistiques comparées | Momentum, puis la rangée Carte des tirs | (Joueurs en vue sur Classement en direct). L'en-tête du score est au-dessus des trois colonnes, sur toute la largeur. Un bloc sans donnée n'est pas affiché. Aucune donnée, aucun libellé et aucune animation n'est retiré par L186 : seule la disposition change."
    message: ~
    champs: [entete-score, colonne-centre, rangee-stats-elan, rangee-tirs-joueurs, colonne-centre-bas, faits-match, elan, carte-tirs, bloc-statistiques, joueurs-en-vue, classement-direct]
    statut: sourcee
    source: "demande du lot L160 : « le centre porte l'en-tête du score, les faits du match, la carte des tirs ou le momentum, et les statistiques globales ou comparées » ; amendée par L186 : « Statistiques et Momentum côte à côte, même hauteur, au-dessus de la carte des tirs », « à sa droite Joueurs en vue et Classement en direct empilés », « aucune donnée ni animation retirée »"
    tests: ["R8 — 1440 : le centre contient faits, statistiques et momentum, carte des tirs, joueurs en vue, classement, dans cet ordre", "R8 — sans tir : la carte des tirs n'est pas affichée, le Momentum reste", "R8 — aucune donnée retirée : mêmes libellés, mêmes tirs, mêmes barres de Momentum qu'avant L186"]
  - id: R9
    etat: charge
    enonce: "Les statistiques d'équipe d'un côté listent ses valeurs seules (libellé, nombre) pour les mesures hors possession, tirs, tirs cadrés et xG : passes complétées, passes dans la moitié adverse, centres, tacles, interceptions, duels au sol et aériens, récupérations, fautes, hors-jeu. Les lignes à 0 des deux équipes sont omises. Les barres comparées du centre ne portent que possession (touches), tirs, tirs cadrés et xG."
    message: ~
    champs: [stats-equipe-domicile, stats-equipe-visiteur, bloc-statistiques]
    statut: hypothese
    si_faux: "Si les barres doivent garder les 14 mesures actuelles, le centre les reprend et les statistiques latérales deviennent un doublon ou un sous-ensemble : seul le partage des mesures entre les deux blocs change ; le contrat de l'API est intact."
    tests: ["R9 — les 4 mesures du centre ne sont pas répétées dans les blocs latéraux", "R9 — une mesure à 0 des deux côtés n'apparaît nulle part"]
  - id: R10
    etat: charge
    enonce: "Sous 1440 px de fenêtre, tout s'empile en une colonne, dans l'ordre : en-tête du score, Faits du match, Statistiques comparées, Momentum, Carte des tirs, Joueurs en vue, Classement en direct, puis composition et statistiques de l'équipe à domicile, composition et statistiques de l'équipe visiteuse. Le DOM est écrit dans cet ordre, qui est aussi l'ordre affiché sous 1440 px, et à 1440 px l'ordre de lecture du centre (rangée par rangée, de gauche à droite : Faits, Statistiques, Momentum, Carte des tirs, Joueurs en vue, Classement) est celui du DOM, sans réordonnancement (WCAG 1.3.2) : ni order, ni flex-direction inversé, ni grid-row / grid-column n'inversent ces blocs entre eux ; la grille place seulement le centre (un bloc de DOM) dans la colonne du milieu et les côtés dans les colonnes 1 et 3. display:contents est autorisé uniquement sur des div neutres (enveloppes du centre, des rangées, de la pile et des côtés) pour les aplatir sous 1440 px, jamais sur un élément qui porte un rôle ou une sémantique (section, ul, table, button). Les rangées Statistiques | Momentum et Carte des tirs | pile n'existent qu'à partir de 1440 px ; en dessous chaque bloc occupe toute la largeur."
    message: ~
    champs: [grille-match, colonne-centre, rangee-stats-elan, rangee-tirs-joueurs, colonne-centre-bas]
    statut: hypothese
    si_faux: "Si l'ordre empilé doit changer (compositions avant les faits, par exemple, ou Momentum avant Statistiques), seul l'ordre du DOM change, avec l'ordre CSS qui le suit ; la disposition à 1440 des rangées reste valable. Si la rangée côte à côte doit commencer plus tôt que 1440 px, seul le seuil change."
    tests: ["R10 — 390 : ordre des blocs de haut en bas", "R10 — ordre du DOM = ordre affiché à 390 (Statistiques avant Momentum, compositions de Lyon avant celles de Lens, compositions après Classement en direct)", "R10 — 1440 : l'ordre du DOM des blocs du centre est leur ordre de lecture (haut→bas puis gauche→droite)", "R10 — display:contents n'est posé que sur des div sans rôle ; ni order ni grid-row / grid-column entre les blocs du centre", "R10 — 390 : pas de défilement horizontal (scrollWidth = clientWidth)"]
  - id: R11
    etat: charge
    enonce: "Les contenus, libellés (titre « Momentum » compris : aucun renommage en « Élan ») et données des blocs ne changent pas : aucun nouvel appel API, aucun champ ajouté ; la page lit toujours GET /api/live-match/{gameId}/stats. Les attendus de docs/qa/expectations.md (/match/$gameId : en-tête avec deux clubs, Faits du match, Statistiques, deux blocs Composition de 11, Classement en direct avec 5 lignes) restent vrais. La maquette abrège le bloc Classement en direct (liste simple) : il garde ses colonnes #, J, Diff, Pts et son lien « Ligue 1 → » (MiniStandings), la maquette n'est pas la référence de ce bloc. Le score de l'en-tête garde son séparateur « · » (MatchScore). Seule exception, décidée par le lot : le sigle affiché sous chaque minute des faits du match est celui de R5 (« OL » pour le club suivi, repli sur les trois premières lettres du nom quand 365scores le renvoie vide) au lieu du symbolicName brut, souvent vide."
    message: ~
    champs: [entete-score, faits-match, bloc-statistiques, bloc-composition, classement-direct]
    statut: sourcee
    source: "docs/qa/expectations.md section /match/$gameId ; demande du lot (disposition seulement) ; exception de contenu décidée par le lot à la revue de conformité du 2026-10-16 : le sigle sous chaque minute des faits est celui de R5 (symbolicName brut souvent vide)"
    tests: ["R11 — deux blocs Composition de 11 titulaires, Faits, Statistiques, Classement de 5 lignes présents", "R11 — un seul appel /api/live-match/{gameId}/stats"]

  - id: R12
    etat: charge
    enonce: "Le titre de chaque bloc (Composition · club, Faits du match, Momentum, Carte des tirs, Statistiques, Statistiques · club, Joueurs en vue, Classement en direct) est un titre h2, sans changement d'apparence ; la page a un seul h1 (les deux clubs), de sorte qu'on navigue de bloc en bloc au lecteur d'écran. Exception : le titre « Composition · club » n'est plus tronqué, il passe à la ligne, et l'en-tête d'une composition a une hauteur minimale de 60 px à partir de 1440 px, pour que les deux terrains restent à la même ordonnée quand un nom de club tient sur deux lignes."
    message: ~
    champs: [titre-composition, faits-match, bloc-statistiques, joueurs-en-vue, classement-direct]
    statut: sourcee
    source: "revue UX de la maquette : WCAG 1.3.1, technique H42 (titres balisés) ; les 10 blocs de la maquette ; titre non tronqué et en-tête de 60 px minimum dès 1440 px : décision du lot à la revue de conformité du 2026-10-16 (un nom de club sur deux lignes décalait l'un des deux terrains)"
    tests: ["R12 — 10 titres h2 en charge, dont « Momentum », un seul h1", "R12 — l'apparence des titres est inchangée (mêmes classes)", "R12 — le titre n'est ni tronqué ni coupé (pas de truncate, line-clamp ni text-ellipsis) et peut rétrécir pour passer à la ligne", "R12 — même jeu de classes que les autres titres h2 (l'apparence ne diffère pas d'un bloc à l'autre)", "R12 — l'en-tête réserve la place de deux lignes à 1440, pour que les deux terrains restent à la même ordonnée quand un seul titre passe à la ligne"]
  - id: R13
    etat: exterieur
    enonce: "Quand l'OL joue à l'extérieur, l'équipe à domicile (adversaire) est à gauche et l'OL à droite ; l'en-tête, les faits (côté de chaque fait) et la carte des tirs suivent le côté domicile / visiteur, la couleur suit le club (R5) : adversaire bleu à gauche, OL rouge à droite, y compris barres, points de tirs, libellés d'attaque (« ↓ OL attaque » rouge à gauche, « RCL attaque ↑ » bleu à droite, L186), barres et pastilles de but du Momentum, et la cellule de chaque joueur de Joueurs en vue (domicile à gauche, visiteur à droite) ; les alignements de R4 et R6 sont inchangés."
    message: ~
    champs: [entete-score, grille-match, bloc-composition, stats-equipe-domicile, stats-equipe-visiteur, faits-match, elan, carte-tirs, bloc-statistiques, joueurs-en-vue]
    statut: sourcee
    source: "demande du lot L160 : « domicile à gauche, visiteur à droite » ; couleur par club : R5 ; revue UX de la maquette (variante OL à l'extérieur)"
    tests: ["R13 — OL à l'extérieur : adversaire à gauche, OL à droite en rouge", "R13 — OL à l'extérieur : barres et points de tirs de l'OL en rouge", "R13 — OL à l'extérieur : Joueurs en vue, domicile à gauche et visiteur à droite", "R13 — OL à l'extérieur : libellés d'attaque, OL en rouge à gauche et adversaire en bleu à droite"]

  - id: R14
    etat: probable
    enonce: "Un match à venir avec compositions probables (365scores non « Confirmé ») affiche les deux compositions sur leurs côtés, chacune avec l'étiquette « Composition probable » ; le centre affiche chaque bloc dont les données existent : Statistiques, avec son message, est garanti, sans faits, tirs ni momentum, et Joueurs en vue ne disparaît jamais (R3) : avec chiffres de saison dans #etat-probable (mention de période), avec son état vide dans #etat-probable-mixte, en pleine largeur sous Statistiques faute de carte des tirs (R18) ; Classement en direct s'ajoute dès que standings existe (la maquette ne le montre pas) ; les statistiques d'équipe latérales sont absentes. L'étiquette est placée entre l'en-tête du bloc et le terrain, dans une bande de 24 px de haut réservée dans les DEUX compositions dès que l'une est probable (une composition confirmée voisine garde une bande vide, montrée en pointillés dans #etat-probable-mixte, où Lyon est probable et Lens confirmée) : les deux terrains restent à la même ordonnée (R4, R6). #etat-probable montre le cas où les deux compositions sont probables. Sous 1440 px, l'étiquette reste sous l'en-tête de son bloc."
    message: "Composition probable"
    champs: [entete-score, coup-envoi, grille-match, colonne-centre, bloc-composition, etiquette-probable, bande-reservee, terrain-composition, bloc-statistiques, message-stats-vide, rangee-tirs-joueurs, colonne-centre-bas, joueurs-en-vue, message-joueurs-en-vue-vide, periode-joueurs-en-vue]
    statut: sourcee
    source: "docs/qa/expectations.md:53-54 (étiquette « Composition probable » sur un match à venir, jamais sans elle) ; lineup-card.tsx:41-44 (data-testid etiquette-probable) ; hauteur de la bande, 24 px, et réservation dans les deux blocs : hypothèse de la maquette, si fausse seule la valeur ou la règle de réservation change"
    tests: ["R14 — à venir probable : deux compositions, chacune avec l'étiquette « Composition probable »", "R14 — terrains à la même ordonnée (±1 px) même si une seule composition est probable", "R14 — centre : message « Pas encore de statistiques. », pas de faits ni de tirs"]

  - id: R15
    etat: charge
    enonce: "Les nombres décimaux des statistiques (xG) s'écrivent à la française, virgule et deux décimales (« 1,87 », decimalFr(n, 2)) ; amendée le 18-10 par L179 (revue UX L9 : nombres fr-FR), l'hypothèse « point » d'origine étant tombée."
    message: ~
    champs: [bloc-statistiques]
    statut: sourcee
    source: "revue UX L9 du 18-10 (libellés et nombres non français, Nielsen 2), décision du lead ; lot L179"
    tests: ["R15 — le xG s'affiche avec une virgule et deux décimales"]

  - id: R16
    etat: charge
    enonce: "À 1440 px, Statistiques comparées (à gauche) et Momentum (à droite) forment une rangée de deux blocs de même largeur (264 px) et de même hauteur (la plus grande des deux, align-items: stretch), sous les Faits du match et au-dessus de la carte des tirs. Le Momentum est moins haut À TOUTE LARGEUR : son tracé a pour hauteur min(96 px, hauteur de l'ancien tracé), l'ancien étant le svg 700 × 160 pleine largeur de son panneau (largeur de l'écran − 74 px, p-4 + px-5) : 96 px dès ~494 px d'écran (1024, 1439, 1440, 1920, 2560 px), et 72 px à 390 px (58 px à 320 px) comme avant (jamais plus de 100 px) : svg viewBox 240 × 96, largeur 100 %, preserveAspectRatio=none (les barres s'élargissent ou s'étroitisent, la hauteur ne change pas) ; les pastilles de but sont dessinées dans une couche à part, non déformée (cx en %, cy en px), pour rester rondes ;  la légende, les barres par minute, les pastilles de but, l'animation et l'équivalent textuel restent tels que R5 les décrit. Dans la demi-largeur, chaque statistique comparée met sa valeur à gauche, son libellé au centre et sa valeur à droite sur une ligne, la barre comparée dessous sur toute la largeur. Sans Momentum, Statistiques occupe toute la largeur du centre. Au-delà de 1440 px (centre plus large que 544 px), les deux blocs gardent la même hauteur (étirement) ; le tracé ne grandit pas (plafond 96 px) et n'est jamais plus haut qu'avant L186 sur téléphone (≤ 72 px à 390 px)."
    message: ~
    champs: [rangee-stats-elan, bloc-statistiques, elan]
    statut: sourcee
    source: "demande du lot L186 : « Momentum moins haut ; Statistiques et Momentum côte à côte, même hauteur, au-dessus de la carte des tirs ». Hauteur du tracé (min(96 px, ancien tracé)), disposition valeur / libellé / valeur dans la demi-largeur, pleine largeur d'un bloc resté seul : hypothèse de la maquette, si fausse seules les valeurs changent (présentation seule, aucune donnée)"
    tests: ["R16 — 1440 : Statistiques et Momentum côte à côte, mêmes largeur (±1 px) et hauteur (±1 px), sous Faits du match et au-dessus de la carte des tirs", "R16 — le tracé du Momentum mesure 96 px de haut à 1024, 1439, 1440, 1920 et 2560", "R16 — à 390 px le tracé mesure au plus 72 px (hauteur de l'ancien tracé) et à 320 px au plus 58 px", "R16 — les pastilles de but du Momentum restent rondes (rapport largeur/hauteur 1 ±5 %) à 390 et à 1920", "R16 — 390 : Statistiques puis Momentum, empilés, pleine largeur", "R16 — sans Momentum, Statistiques occupe toute la largeur du centre"]
  - id: R17
    etat: charge
    enonce: "La carte des tirs est plus petite et son terrain est à la verticale (buts en haut et en bas, rotation d'un quart de tour du terrain actuel) : viewBox 450 × 700, largeur au plus 224 px, centré dans son bloc. Les tirs sont les mêmes que sur l'ancienne carte, ceux des DEUX équipes, avec les mêmes formes par issue, les mêmes tailles (xG) et les mêmes couleurs par club (R5) ; seule leur position est tournée (le club à domicile attaque vers le haut, le visiteur vers le bas) et leurs marqueurs sont agrandis de 60 % pour rester AU MOINS aussi lisibles qu'avant L186 : rayons, demi-côté des croix et écart du halo du but multipliés par 1,6 par rapport à l'ancienne carte, et épaisseurs de trait multipliées par 1,6 elles aussi (tir manqué 3,2 unités de viewBox au lieu de 2, tir bloqué 2,8 au lieu de 1,75, tir cadré 2,4 au lieu de 1,5, bordure blanche du but 2 au lieu de 1,25, halo du but 1,6 au lieu de 1). À 224 px de large l'échelle est 0,498 px par unité (0,743 avant) : le plus petit tir manqué (rayon 5,28) mesure alors 5,26 px de diamètre et 1,59 px de trait, contre 4,9 px et 1,5 px avant ; la règle est « diamètre ≥ 4,9 px et trait ≥ 1,5 px ». Les libellés d'attaque, la légende des issues (deux colonnes à 1440) et la légende du marqueur restent sous le terrain. Le terrain garde cette orientation à toute largeur."
    message: ~
    champs: [carte-tirs, rangee-tirs-joueurs]
    statut: sourcee
    source: "demande du lot L186 : « carte des tirs plus petite, terrain à la verticale (buts en haut et en bas), mêmes tirs des deux équipes ». Sens (domicile vers le haut), largeur 224 px : hypothèse de la maquette, si fausse seules ces valeurs changent ; agrandissement de 60 % (et non 40 %) : revue de maquette du 18-10, à 40 % le plus petit tir manqué tombait à 4,6 px de diamètre et 1 px de trait, moins lisible qu'avant (4,9 px et 1,5 px)"
    tests: ["R17 — la carte des tirs est plus haute que large (terrain vertical) et sa largeur ne dépasse pas 224 px", "R17 — à 224 px de large, le plus petit tir manqué mesure au moins 4,9 px de diamètre et son trait au moins 1,5 px (rayon et épaisseur du code multipliés par 1,6 par rapport à l'ancienne carte)", "R17 — mêmes tirs : autant de marqueurs de chaque club et de chaque issue qu'avant, positions tournées (x, y) → (y, 700 − x)", "R17 — le club à domicile tire vers le haut, libellés « ↓ visiteur attaque » et « domicile attaque ↑ »"]
  - id: R18
    etat: charge
    enonce: "À 1440 px, sous la rangée Statistiques | Momentum, la carte des tirs occupe la moitié gauche du centre (264 px) et, à sa droite, Joueurs en vue puis Classement en direct sont empilés (écart 16 px, même largeur 264 px), alignés en haut sur la carte. Ces deux blocs gardent leur contenu, leurs conditions d'affichage (L173 pour Joueurs en vue, y compris l'état vide d'un match à venir) et leur titre h2. Sans carte des tirs, la pile occupe toute la largeur du centre ; sans pile (ni Joueurs en vue ni Classement en direct, par exemple un match de coupe), la carte des tirs occupe TOUTE la largeur du centre, comme R4 (« une rangée qui n'a plus qu'un bloc le laisse occuper toute la largeur du centre ») : jamais de trou de 264 px à droite ; la carte garde alors sa largeur maximale de 224 px, centrée dans son bloc (R17). Joueurs en vue montre tous ses rôles réels (Attaquant, Milieu de Terrain, Défenseur, chacun avec la statistique de son rôle : « Buts attendus : 0,35 », « Passes décisives : 3 », « Tacles : 5 ») sans en retirer aucune donnée. Dans une demi-largeur de 264 px (cellule d'environ 105 px par joueur), la ligne de statistique PEUT RETOMBER À LA LIGNE (pas de white-space: nowrap, overflow-wrap) : libellé et valeur restent entiers, alignés à droite pour le domicile et à gauche pour le visiteur, sans jamais déborder sur la colonne voisine ; le bloc est plus haut qu'avec un seul rôle (≈ 230 px), le Classement en direct descend d'autant, accepté. Sous 1440 px : carte des tirs, Joueurs en vue, Classement en direct empilés pleine largeur."
    message: ~
    champs: [rangee-tirs-joueurs, carte-tirs, colonne-centre-bas, joueurs-en-vue, classement-direct]
    statut: sourcee
    source: "demande du lot L186 : « à sa droite Joueurs en vue et Classement en direct empilés ; écran étroit : tout empilé dans l'ordre de lecture ». Alignement en haut (pas d'étirement) et pleine largeur d'un bloc resté seul : hypothèse de la maquette, si fausse seule la présentation change (aucune donnée) ; la pile peut être plus courte que la carte, le vide sous le Classement est accepté"
    tests: ["R18 — 1440 : Joueurs en vue puis Classement en direct à droite de la carte des tirs, même haut (±1 px), 16 px d'écart entre eux", "R18 — 1440 : sans carte des tirs, la pile occupe toute la largeur du centre", "R18 — 1440 : sans Joueurs en vue ni Classement en direct, la carte des tirs occupe toute la largeur du centre (aucun trou à droite, cohérent avec R4)", "R18 — 264 px : les trois rôles de Joueurs en vue sont affichés, la ligne « Buts attendus : 0,35 » ne déborde pas de sa cellule ni sur la colonne adverse (bord droit ≤ bord de la cellule)", "R18 — 390 : carte des tirs, Joueurs en vue, Classement en direct empilés dans cet ordre"]

actions:
  - { id: A1, declencheur: ~, appel: "GET /api/live-match/{gameId}/stats", regles: [R1, R2, R3, R4, R5, R6, R7, R8, R9, R10, R11, R12, R13, R14, R15, R16, R17, R18] }
