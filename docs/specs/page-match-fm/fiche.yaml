ecran:
  id: page-match-fm
  titre: Page du match disposée comme un écran de match de Football Manager
  route: /match/$gameId
  lot: L160
  largeurs: [1440, 390]
  maquette: docs/specs/page-match-fm/maquette.html
etats: [vide, chargement, erreur, charge, exterieur, probable, probable-mixte]

champs:
  - { id: message-chargement, libelle: Message de chargement, type: texte, source: statique, obligatoire: true }
  - { id: message-erreur, libelle: Message d'erreur de la page, type: texte, source: statique, obligatoire: true }
  - { id: message-stats-vide, libelle: Message sans statistiques, type: texte, source: statique, obligatoire: false }
  - { id: entete-score, libelle: En-tête du score (statut, compétition, horloge, clubs, score, buteurs), type: carte, source: "GET /api/live-match/{gameId}/stats → status, competitionName, home, away, events", obligatoire: true }
  - { id: grille-match, libelle: Grille à trois colonnes fixes à partir de 1440 px, type: liste, source: statique, obligatoire: true }
  - { id: colonne-centre, libelle: Colonne centrale haute (faits, momentum, tirs, statistiques comparées), type: liste, source: "GET /api/live-match/{gameId}/stats", obligatoire: true }
  - { id: colonne-centre-bas, libelle: Colonne centrale basse (joueurs en vue, classement), type: liste, source: "GET /api/live-match/{gameId}/stats → topPerformers, standings", obligatoire: false }
  - { id: bloc-composition, libelle: Bloc Composition d'une équipe, type: carte, source: "GET /api/live-match/{gameId}/stats → lineups", obligatoire: false }
  - { id: titre-composition, libelle: Titre « Composition · club », type: texte, source: "GET /api/live-match/{gameId}/stats → équipe", obligatoire: false }
  - { id: formation-composition, libelle: Pastille de la formation, type: texte, source: "GET /api/live-match/{gameId}/stats → lineup.formation", obligatoire: false }
  - { id: terrain-composition, libelle: Terrain de hauteur fixe portant les rangées, type: carte, source: "GET /api/live-match/{gameId}/stats → lineup.starters", obligatoire: false }
  - { id: rangee-composition, libelle: Rangée de joueurs, type: ligne, source: "GET /api/live-match/{gameId}/stats → lineup.starters", obligatoire: false }
  - { id: banc-composition, libelle: Banc sur une ligne, type: texte, source: "GET /api/live-match/{gameId}/stats → lineup.bench", obligatoire: false }
  - { id: stats-equipe-domicile, libelle: Statistiques de l'équipe à domicile (valeurs seules), type: carte, source: "GET /api/live-match/{gameId}/stats → teamStats.home", obligatoire: false }
  - { id: stats-equipe-visiteur, libelle: Statistiques de l'équipe visiteuse (valeurs seules), type: carte, source: "GET /api/live-match/{gameId}/stats → teamStats.away", obligatoire: false }
  - { id: faits-match, libelle: Faits du match, type: liste, source: "GET /api/live-match/{gameId}/stats → events", obligatoire: false }
  - { id: elan, libelle: Momentum (barres par minute, légende des clubs, légende de direction), type: carte, source: "GET /api/live-match/{gameId}/stats → momentum", obligatoire: false }
  - { id: bande-reservee, libelle: Bande de 24 px réservée (vide) dans une composition confirmée voisine d'une probable, type: texte, source: statique, obligatoire: false }
  - { id: etiquette-probable, libelle: Étiquette « Composition probable », type: texte, source: "GET /api/live-match/{gameId}/stats → lineups.probable", obligatoire: false }
  - { id: carte-tirs, libelle: Carte des tirs, type: carte, source: "GET /api/live-match/{gameId}/stats → shots", obligatoire: false }
  - { id: bloc-statistiques, libelle: Statistiques comparées (barres), type: carte, source: "GET /api/live-match/{gameId}/stats → teamStats", obligatoire: true }
  - { id: joueurs-en-vue, libelle: Joueurs en vue, type: carte, source: "GET /api/live-match/{gameId}/stats → topPerformers", obligatoire: false }
  - { id: classement-direct, libelle: Classement en direct, type: carte, source: "GET /api/live-match/{gameId}/stats → standings", obligatoire: false }

regles:
  - id: R1
    etat: chargement
    enonce: Pendant le chargement, la page affiche le message d'attente existant, sans grille et sans squelette (aucun squelette n'est ajouté par le lot).
    message: "Chargement du match…"
    champs: [message-chargement]
    statut: sourcee
    source: "frontend/src/routes/match.tsx (isLoading) ; état inchangé par le lot"
    tests: ["R1 — chargement : message, aucune colonne"]
  - id: R2
    etat: erreur
    enonce: Si le match ne se charge pas, la page affiche l'erreur existante et un lien de retour, sans grille.
    message: "Match introuvable"
    champs: [message-erreur]
    statut: sourcee
    source: "frontend/src/routes/match.tsx (isError) ; texte inchangé. Couleur : jeton --loss-fg (hsl 0 84% 63%, frontend/src/index.css:30, créé en L138, 5,36:1 sur le panneau --surface, 5,64:1 sur --bg), classe text-loss-fg, jamais text-loss (3,85:1 sur le panneau, sous 4,5:1, WCAG 1.4.3) — revue UX de la maquette"
    tests: ["R2 — erreur : message, aucune colonne", "R2 — le message d'erreur porte la classe text-loss-fg (contraste ≥ 4,5:1)"]
  - id: R3
    etat: vide
    enonce: "Sans composition publiée, ni fait, tir ou momentum (match à venir sans composition même probable), l'en-tête reste, les blocs absents ne s'affichent pas (aucun cadre vide), les colonnes latérales sont vides et le centre garde sa largeur ; le bloc Statistiques annonce l'absence de chiffres. Le centre affiche chaque bloc dont les données existent : Statistiques est le seul bloc garanti, et Joueurs en vue et Classement en direct s'affichent dès que topPerformers et standings existent, y compris avant le coup d'envoi (les données réelles d'un match à venir en portent déjà) ; le masque ci-dessous décrit le cas où ces données sont absentes. L'en-tête d'un match à venir affiche « À venir », la compétition, « vs » à la place du score et l'horloge « À VENIR », et sous l'en-tête la date courte et l'heure du coup d'envoi (« Jeu. 22/10 · 21h00 », comme la page de match des Bleus depuis L168), ou « Horaire à confirmer » quand timeConfirmed est faux (L172). Sur un match à venir, le bloc Joueurs en vue ne disparaît jamais en silence : il n'est plus dans le masque, et quand topPerformers est vide il s'affiche avec un état vide explicite (message d'état vide, texte fixé par L173) ; sur un match terminé, il reste dans le masque et disparaît quand topPerformers est vide (L173)."
    message: "Pas encore de statistiques."
    champs: [entete-score, grille-match, colonne-centre, bloc-statistiques, message-stats-vide]
    masque: [bloc-composition, stats-equipe-domicile, stats-equipe-visiteur, faits-match, elan, carte-tirs, classement-direct]
    statut: sourcee
    source: "match.tsx (blocs conditionnés à leurs données, message « Pas encore de statistiques. » de statRows ; en-tête : isUpcoming, deriveClock → « À VENIR », MatchScore → « vs ») ; amendée le 17-10 sur décision du lead (cohérence avec la carte de /cups et la page des Bleus, Nielsen n° 1 et n° 4) : date et heure du coup d'envoi d'un match à venir ou « Horaire à confirmer » (L172), Joueurs en vue avec état vide sur un match à venir (L173) ; docs/specs/composition-match R3 : « sans composition publiée, son bloc n'est pas affiché »"
    tests: ["R3 — vide : en-tête et message, aucun bloc absent, centre à la même largeur qu'avec données"]
  - id: R4
    etat: charge
    enonce: "À partir de 1440 px de fenêtre (seuil `min-[1440px]`, pas xl), la page est une grille fixe de trois colonnes INDÉPENDANTES, chacune une pile verticale de ses propres blocs avec un écart uniforme de 16 px, sans rangée commune d'une colonne à l'autre : équipe à domicile à gauche (composition puis statistiques d'équipe), match au centre (Faits du match, Momentum, Carte des tirs, Statistiques comparées, Joueurs en vue, Classement en direct), équipe visiteuse à droite (composition puis statistiques d'équipe) ; colonnes latérales 280 px, centre = le reste, gouttière de 16 px entre colonnes (column-gap sur la grille ET sur la grille des côtés, mêmes colonnes 280 px / reste / 280 px, pour que les côtés restent alignés sur le centre : les bordures ne se touchent jamais). Enveloppe réelle de l'app (app-shell.tsx:29-30) : barre latérale fixe de 240 px (lg:pl-[240px]) et marge px-8 (32 px) de chaque côté, donc à 1440 le contenu fait 1440 − 240 − 64 = 1136 px (≈ 1121 avec l'ascenseur) et le centre ≈ 529 px (≥ 480 : Momentum, carte des tirs et faits lisibles) ; la maquette reproduit cette enveloppe (barre de 240 px, main à 32 px) et ses captures 1440 la montrent. Avec des côtés de 320 px le centre n'aurait que ≈ 481 px à 1440 et ≈ 321 px à 1280 : d'où les côtés de 280 px et le seuil à 1440 ; entre lg et 1439 px la page reste empilée (R10), faute de place pour un centre d'au moins 480 px. Un bloc du centre sans donnée n'est pas affiché et le suivant remonte : jamais de trou, quel que soit l'état (match à venir, sans élan, sans tir). Aucune colonne ne s'étire à la hauteur d'une autre (align-items: start) : la hauteur d'un côté ne déplace aucun bloc du centre, ni l'inverse. Mise en œuvre (le DOM de R10 coupe le centre en deux, centre haut puis les côtés puis centre bas, donc une seule enveloppe de colonne centrale est impossible sans le réordonner) : grille extérieure à rangées auto / auto / 1fr ; centre haut (faits à statistiques comparées) en rangée 1 de la colonne 2, centre bas (joueurs en vue, classement) en rangée 2 avec une marge haute de 16 px, donc à 16 px sous le bas du centre haut quelle que soit sa hauteur ; les côtés forment UN élément (une grille à deux rangées, compositions puis statistiques d'équipe, mêmes colonnes 280 px / reste / 280 px) qui occupe les trois rangées et laisse passer la souris sur la colonne centrale ; la rangée 3, flexible, est la seule à absorber la hauteur excédentaire des côtés. Les deux compositions partagent la rangée 1 des côtés (même hauteur, étirées de moins d'une ligne de banc : l'écart des bancs, jamais plus) et les deux blocs de statistiques d'équipe commencent donc à la même ordonnée, sous les compositions, sans cadre vide ; les terrains gardent la même hauteur fixe (R6). BalancedColumns (mesure, répartition, observateur de taille) et balanceColumns ne sont plus utilisés par la page : aucun bloc ne change de colonne selon sa hauteur."
    message: ~
    champs: [grille-match, colonne-centre, colonne-centre-bas]
    statut: sourcee
    source: "demande du lot L160 : « disposition fixe à 1440 », « domicile à gauche, visiteur à droite », « remplacée par cette disposition fixe » ; capture FM27 docs/specs/page-match-fm/reference-fm27.webp ; largeur 320 px : hypothèse R10"
    tests: ["R4 — 1440 dans l'enveloppe de l'app (barre 240 px + marges 32 px) : trois colonnes, domicile à gauche, visiteur à droite, centre au milieu", "R4 — 1440 : les deux blocs de statistiques d'équipe commencent à la même ordonnée (±1 px) et les deux compositions ont la même hauteur (±1 px), même si un banc tient sur deux lignes et l'autre sur une", "R4 — 1440 : gouttière de 16 px entre les colonnes (bord droit d'une colonne + 16 = bord gauche de la suivante, ±1 px, y compris Composition et Statistiques de chaque côté), centre ≥ 480 px", "R4 — 1439 : empilement une colonne, pas de trois colonnes", "R4 — 1440 : un bloc qui grandit ne change pas de colonne", "R4 — aucun trou : dans la colonne centrale, chaque bloc commence à (bas du précédent + 16 px de gap) ±1 px, quel que soit l'état (charge complet, sans carte des tirs, sans tirs ni Momentum, sans faits ni tirs, sans joueurs en vue ni classement)", "R4 — état à venir : la colonne centrale ne laisse pas de vide au-dessus du premier bloc présent (le haut du premier bloc est le haut de la grille, ±1 px), avec ou sans compositions probables", "R4 — 1440 : les colonnes sont indépendantes (agrandir un bloc latéral ne déplace aucun bloc du centre ; masquer un bloc du centre ne déplace aucun bloc latéral)", "R4 — 1440×900 : le début des statistiques d'équipe est visible sans défiler et aucun panneau latéral n'a plus de 15 % de vide", "R4 — BalancedColumns n'est plus importé par match.tsx"]
  - id: R5
    etat: charge
    enonce: "Chaque côté porte sa composition puis ses statistiques d'équipe : colonne de gauche = équipe à domicile (data.home), colonne de droite = équipe visiteuse (data.away), que ce soit l'OL ou non. Une seule règle de couleur pour tout ce qui porte une équipe : la couleur suit le CLUB, pas le côté (OL toujours rouge, adversaire toujours bleu), que l'OL joue à domicile ou à l'extérieur, avec la même teinte pour un même club dans tous les blocs. (a) Éléments graphiques (barres comparées, barres et pastilles de but du Momentum, points et marqueurs de la carte des tirs, pastilles de légende des clubs) : OL = --ol-red (hsl 0 73% 50%, 3,85:1 sur --surface), adversaire = --ol-blue-bright (hsl 226 56% 51%, 3,20:1 sur --surface, 3,10:1 sur le fond du terrain de la carte des tirs), opacité 1 partout (WCAG 1.4.11 : 3:1 ; à l'opacité 0,85 du composant actuel le bleu tombe à 2,63:1, et --ol-blue, 1,83:1 sur --surface, est interdit pour un élément graphique). Calcul : luminance relative WCAG 2.x L = 0,2126 R + 0,7152 G + 0,0722 B (R, G, B linéarisés), rapport (L1 + 0,05) / (L2 + 0,05), --surface = hsl 228 21% 8%. (b) Texte qui porte une équipe (libellés « ← RCL attaque » / « OL attaque → » de la carte des tirs, numéros de pastille de composition) : OL = --ol-red-bright (4,95:1), adversaire = hsl(226 70% 70%) (6,59:1), WCAG 1.4.3 (4,5:1) ; le libellé actuel, text-ol-blue en 9 px à 1,83:1, est corrigé. (c) Composition (bordure de pastille, pastille de formation) : tokens de docs/specs/composition-match inchangés, décoratifs (le nom et le numéro portent le sens). Le Momentum se dessine comme le composant actuel (momentum-chart.tsx) : barres vers le haut pour l'équipe à domicile, vers le bas pour la visiteuse, pastille de but (rond cerclé de blanc) sur la barre de la minute du but, chacune à la couleur de son club ; légende aux noms des clubs (domicile puis visiteur), légende de direction « Vers le haut : <domicile>, vers le bas : <visiteur>. » et équivalent textuel (role=\"img\", aria-label « Momentum »). Carte des tirs : légende des clubs « symbole + nom » (OL Lyon, RCL Lens), un point par tir (forme par issue : rond plein = cadré, rond plein cerclé de blanc avec halo = but, croix = bloqué, rond vide = manqué ; taille = xG), légende des issues en gris neutre (elle ne porte aucun club), fond du terrain neutre (--surface-2 à 50 %) et non le rgba(20,32,28,0.5) actuel, légèrement vert (CLAUDE.md : pas de vert décoratif). L'implémentation applique les mêmes couleurs aux vrais MomentumChart et ShotMap quand ils sont placés dans la nouvelle disposition : MomentumChart passe de --ol-blue à --ol-blue-bright, de l'opacité 0,85 à 1 et de la couleur par côté à la couleur par club (pastilles de but comprises) ; ShotMap passe de la couleur par côté à la couleur par club, de --ol-blue à --ol-blue-bright, de #62a8e3 à la teinte du club pour les contours, et colore ses libellés d'attaque comme en (b) ; StatRow (barres comparées) passe de --ol-blue à --ol-blue-bright, avec un séparateur de 2 px de la couleur de --surface entre les deux segments. Variante « OL à l'extérieur » montrée dans #etat-exterieur. Sigle d'un club (carte des tirs, faits du match) : « OL » fixe pour le club suivi (jamais « LYO »), le sigle de 365scores pour l'adversaire et, quand 365scores le renvoie vide, les trois premières lettres du nom en capitales (« REN »). Légende de la carte des tirs « sigle + nom » ; quand le sigle n'est qu'un repli tiré du nom, elle se réduit au nom (« Rennes », pas « REN Rennes »). Libellés d'attaque de la carte des tirs : une ligne horizontale sous la surface de jeu, « ← <visiteur> attaque » à gauche et « <domicile> attaque → » à droite, jamais posés sur le terrain (les tirs se concentrent dans les surfaces : posés dessus, ils se recouvrent, contraste mesuré 1,28:1) ; la maquette les montre ainsi."
    message: ~
    champs: [bloc-composition, titre-composition, formation-composition, rangee-composition, banc-composition, stats-equipe-domicile, stats-equipe-visiteur, elan, carte-tirs, bloc-statistiques]
    statut: sourcee
    source: "demande du lot L160 : « chaque équipe a son côté (domicile à gauche, visiteur à droite) avec sa composition et ses statistiques d'équipe » ; couleur par club : lineup-card.tsx (accent red|blue suit l'OL), CLAUDE.md palette stricte rouge + bleu OL (OL rouge, marqueur OL de la carte rouge, pas de vert décoratif). Étendre cette règle aux barres, tirs et élan (aujourd'hui par côté dans StatRow, ShotMap, MomentumChart) et changer le bleu des éléments graphiques sont des choix de la revue UX : changement de présentation seul, aucune donnée. Contrastes calculés le 2026-10-16 par luminance relative : rouge 3,85:1, bleu 3,20:1 sur --surface ; constats de la revue UX de la maquette sur momentum-chart.tsx:12 (opacité 0,85) et shot-map.tsx:45-49. Décisions du lot prises à la revue de conformité du 2026-10-16, après le scellement : sigle « OL » fixe et repli sur les trois premières lettres du nom (symbolicName de 365scores souvent vide, « LYO » affiché à tort), légende réduite au nom quand le sigle n'est qu'un repli, libellés d'attaque sortis du terrain (contraste mesuré à 1,28:1 en commit e35881a quand ils étaient posés sur les surfaces)"
    tests: ["R5 — OL à domicile : OL à gauche, accent rouge", "R5 — OL en déplacement : OL à droite en rouge, adversaire à gauche en bleu, et barres, points de tirs et barres du Momentum de l'OL en rouge", "R5 — Momentum : barres vers le haut (domicile) et vers le bas (visiteur) à la couleur du club, légende des noms puis « Vers le haut : X, vers le bas : Y », aria-label « Momentum »", "R5 — contraste : les barres du Momentum, les barres comparées et les marqueurs de la carte des tirs mesurent au moins 3:1 sur --surface (rouge OL et bleu adverse, opacité 1) ; les libellés d'attaque et numéros de pastille au moins 4,5:1", "R5 — un même club a la même teinte dans les barres comparées, le Momentum, la carte des tirs et leurs légendes (OL à domicile, puis à l'extérieur)", "R5 — chaque côté contient sa composition puis ses statistiques", "R5 — l'ordre du DOM est celui de R10", "R5 — sous chaque minute : « OL » pour le club suivi (jamais « LYO »), le repli « REN » pour l'adversaire", "R5 — sans sigle de 365scores : « OL Lyon · Rennes », pas « LYO LYON · REN RENNES »", "R5 — avec un vrai sigle adverse, la légende garde « RCL Lens »", "R5 — les libellés d'attaque ne sont pas posés sur le terrain : ni dans son conteneur, ni en position absolue", "R5 — les libellés sont du texte horizontal, sur une seule ligne, sous le terrain", "R5 — la couleur suit le club (OL rouge, adversaire bleu) et reste ≥ 4,5:1, OL à domicile comme à l'extérieur"]

  - id: R6
    etat: charge
    enonce: "Les deux terrains de composition ont la même hauteur quelle que soit la formation (4-2-3-1 à 5 rangées, 4-4-2 à 4 rangées) : les rangées se répartissent verticalement dans cette hauteur fixe. Les rangées, pastilles, repli « formation inconnue » et banc restent ceux de docs/specs/composition-match (R4 à R8), y compris la réduction de police des noms longs (fitNameFont, lineup-card.tsx) que la maquette ne reproduit pas : à 320-390 px, Frankowski, Lacazette et Tessmann y débordent de leur pastille, ce qui n'est pas à reprendre."
    message: ~
    champs: [terrain-composition, rangee-composition, bloc-composition]
    statut: sourcee
    source: "demande du lot L160 : « les deux compositions ont le même gabarit (même hauteur de terrain quelle que soit la formation) pour un alignement propre »"
    tests: ["R6 — 4-2-3-1 contre 4-4-2 : terrains de même hauteur ±1 px", "R6 — 4-2-3-1 contre formation inconnue : même hauteur", "R6 — les 11 titulaires restent visibles dans la hauteur fixe à 1440 et à 390"]
  - id: R7
    etat: charge
    enonce: "La hauteur du terrain est de 360 px à toute largeur, les rangées étant espacées de façon égale (justify-content: space-around)."
    message: ~
    champs: [terrain-composition]
    statut: hypothese
    si_faux: "Si la hauteur doit être autre (320, 400 px) ou suivre la largeur, seule la valeur du gabarit change ; R6 (égalité des deux terrains) reste vraie."
    tests: ["R7 — hauteur du terrain 360 px à 1440 et à 390"]
  - id: R8
    etat: charge
    enonce: "Le centre empile, dans l'ordre : Faits du match, Momentum, Carte des tirs, Statistiques comparées, Joueurs en vue, Classement en direct. L'en-tête du score (statut, compétition, horloge, clubs, score, buteurs) est au-dessus des trois colonnes, sur toute la largeur. Un bloc sans donnée n'est pas affiché."
    message: ~
    champs: [entete-score, colonne-centre, colonne-centre-bas, faits-match, elan, carte-tirs, bloc-statistiques, joueurs-en-vue, classement-direct]
    statut: sourcee
    source: "demande du lot L160 : « le centre porte l'en-tête du score, les faits du match, la carte des tirs ou le momentum, et les statistiques globales ou comparées » ; contenu des blocs : match.tsx actuel ; place de Joueurs en vue et du Classement en direct (bas du centre) : hypothèse R10"
    tests: ["R8 — 1440 : le centre contient faits, momentum, tirs, statistiques dans cet ordre", "R8 — sans tir : la carte des tirs n'est pas affichée, le Momentum reste"]
  - id: R9
    etat: charge
    enonce: "Les statistiques d'équipe d'un côté listent ses valeurs seules (libellé, nombre) pour les mesures hors possession, tirs, tirs cadrés et xG : passes complétées, passes dans la moitié adverse, centres, tacles, interceptions, duels au sol et aériens, récupérations, fautes, hors-jeu. Les lignes à 0 des deux équipes sont omises. Les barres comparées du centre ne portent que possession (touches), tirs, tirs cadrés et xG."
    message: ~
    champs: [stats-equipe-domicile, stats-equipe-visiteur, bloc-statistiques]
    statut: hypothese
    si_faux: "Si les barres doivent garder les 14 mesures actuelles, le centre les reprend et les statistiques latérales deviennent un doublon ou un sous-ensemble : seul le partage des mesures entre les deux blocs change ; le contrat de l'API est intact."
    tests: ["R9 — les 4 mesures du centre ne sont pas répétées dans les blocs latéraux", "R9 — une mesure à 0 des deux côtés n'apparaît nulle part"]
  - id: R10
    etat: charge
    enonce: "Sous 1440 px de fenêtre, tout s'empile en une colonne, dans l'ordre : en-tête du score, Faits du match, Momentum, Carte des tirs, Statistiques comparées, composition puis statistiques de l'équipe à domicile, composition puis statistiques de l'équipe visiteuse, Joueurs en vue, Classement en direct. Le DOM est écrit dans cet ordre, qui est aussi l'ordre affiché sous 1440 px : ni order, ni flex-direction inversé, ni grid-row / grid-column ne le réordonnent sous 1440 px (un lecteur d'écran lit comme l'œil, WCAG 1.3.2). display:contents est autorisé uniquement sur des div neutres (les enveloppes du centre haut, du centre bas, des côtés et de leurs cellules) pour les aplatir sous 1440 px sans changer l'ordre, jamais sur un élément qui porte un rôle ou une sémantique (section, ul, table, button) ; à 1440 px la grille place les blocs avec grid-column / grid-row sans modifier le DOM, qui reste la séquence de lecture. Les colonnes latérales font 280 px et Joueurs en vue et Classement sont au bas du centre à 1440."
    message: ~
    champs: [grille-match, colonne-centre, colonne-centre-bas]
    statut: hypothese
    si_faux: "Si l'ordre empilé doit changer (compositions avant les faits, par exemple) ou les colonnes latérales (280 px) et le seuil (1440 px) changer, seuls l'ordre CSS et la largeur changent ; la disposition à 1440 de R4 reste valable."
    tests: ["R10 — 390 : ordre des blocs de haut en bas", "R10 — ordre du DOM = ordre affiché à 390 (compositions de Lyon avant celles de Lens, Joueurs en vue et Classement en dernier)", "R10 — display:contents n'est posé que sur des div sans rôle ; ni order ni grid-row / grid-column sous 1440 px", "R10 — 390 : pas de défilement horizontal (scrollWidth = clientWidth)"]
  - id: R11
    etat: charge
    enonce: "Les contenus, libellés (titre « Momentum » compris : aucun renommage en « Élan ») et données des blocs ne changent pas : aucun nouvel appel API, aucun champ ajouté ; la page lit toujours GET /api/live-match/{gameId}/stats. Les attendus de docs/qa/expectations.md (/match/$gameId : en-tête avec deux clubs, Faits du match, Statistiques, deux blocs Composition de 11, Classement en direct avec 5 lignes) restent vrais. La maquette abrège le bloc Classement en direct (liste simple) : il garde ses colonnes #, J, Diff, Pts et son lien « Ligue 1 → » (MiniStandings), la maquette n'est pas la référence de ce bloc. Le score de l'en-tête garde son séparateur « · » (MatchScore). Seule exception, décidée par le lot : le sigle affiché sous chaque minute des faits du match est celui de R5 (« OL » pour le club suivi, repli sur les trois premières lettres du nom quand 365scores le renvoie vide) au lieu du symbolicName brut, souvent vide."
    message: ~
    champs: [entete-score, faits-match, bloc-statistiques, bloc-composition, classement-direct]
    statut: sourcee
    source: "docs/qa/expectations.md section /match/$gameId ; demande du lot (disposition seulement) ; exception de contenu décidée par le lot à la revue de conformité du 2026-10-16 : le sigle sous chaque minute des faits est celui de R5 (symbolicName brut souvent vide)"
    tests: ["R11 — deux blocs Composition de 11 titulaires, Faits, Statistiques, Classement de 5 lignes présents", "R11 — un seul appel /api/live-match/{gameId}/stats"]

  - id: R12
    etat: charge
    enonce: "Le titre de chaque bloc (Composition · club, Faits du match, Momentum, Carte des tirs, Statistiques, Statistiques · club, Joueurs en vue, Classement en direct) est un titre h2, sans changement d'apparence ; la page a un seul h1 (les deux clubs), de sorte qu'on navigue de bloc en bloc au lecteur d'écran. Exception : le titre « Composition · club » n'est plus tronqué, il passe à la ligne, et l'en-tête d'une composition a une hauteur minimale de 60 px à partir de 1440 px, pour que les deux terrains restent à la même ordonnée quand un nom de club tient sur deux lignes."
    message: ~
    champs: [titre-composition, faits-match, bloc-statistiques, joueurs-en-vue, classement-direct]
    statut: sourcee
    source: "revue UX de la maquette : WCAG 1.3.1, technique H42 (titres balisés) ; les 10 blocs de la maquette ; titre non tronqué et en-tête de 60 px minimum dès 1440 px : décision du lot à la revue de conformité du 2026-10-16 (un nom de club sur deux lignes décalait l'un des deux terrains)"
    tests: ["R12 — 10 titres h2 en charge, dont « Momentum », un seul h1", "R12 — l'apparence des titres est inchangée (mêmes classes)", "R12 — le titre n'est ni tronqué ni coupé (pas de truncate, line-clamp ni text-ellipsis) et peut rétrécir pour passer à la ligne", "R12 — même jeu de classes que les autres titres h2 (l'apparence ne diffère pas d'un bloc à l'autre)", "R12 — l'en-tête réserve la place de deux lignes à 1440, pour que les deux terrains restent à la même ordonnée quand un seul titre passe à la ligne"]
  - id: R13
    etat: exterieur
    enonce: "Quand l'OL joue à l'extérieur, l'équipe à domicile (adversaire) est à gauche et l'OL à droite ; l'en-tête, les faits (côté de chaque fait) et la carte des tirs suivent le côté domicile / visiteur, la couleur suit le club (R5) : adversaire bleu à gauche, OL rouge à droite, y compris barres, points de tirs, libellés d'attaque (« ← OL attaque » rouge à gauche, « RCL attaque → » bleu à droite), barres et pastilles de but du Momentum, et la cellule de chaque joueur de Joueurs en vue (domicile à gauche, visiteur à droite) ; les alignements de R4 et R6 sont inchangés."
    message: ~
    champs: [entete-score, grille-match, bloc-composition, stats-equipe-domicile, stats-equipe-visiteur, faits-match, elan, carte-tirs, bloc-statistiques, joueurs-en-vue]
    statut: sourcee
    source: "demande du lot L160 : « domicile à gauche, visiteur à droite » ; couleur par club : R5 ; revue UX de la maquette (variante OL à l'extérieur)"
    tests: ["R13 — OL à l'extérieur : adversaire à gauche, OL à droite en rouge", "R13 — OL à l'extérieur : barres et points de tirs de l'OL en rouge", "R13 — OL à l'extérieur : Joueurs en vue, domicile à gauche et visiteur à droite", "R13 — OL à l'extérieur : libellés d'attaque, OL en rouge à gauche et adversaire en bleu à droite"]

  - id: R14
    etat: probable
    enonce: "Un match à venir avec compositions probables (365scores non « Confirmé ») affiche les deux compositions sur leurs côtés, chacune avec l'étiquette « Composition probable » ; le centre affiche chaque bloc dont les données existent : Statistiques, avec son message, est le seul bloc garanti, sans faits, tirs ni momentum, et Joueurs en vue et Classement en direct s'ajoutent en bas du centre dès que topPerformers et standings existent (cas des données réelles d'un match à venir, la maquette ne les montre pas) ; les statistiques d'équipe latérales sont absentes. L'étiquette est placée entre l'en-tête du bloc et le terrain, dans une bande de 24 px de haut réservée dans les DEUX compositions dès que l'une est probable (une composition confirmée voisine garde une bande vide, montrée en pointillés dans #etat-probable-mixte, où Lyon est probable et Lens confirmée) : les deux terrains restent à la même ordonnée (R4, R6). #etat-probable montre le cas où les deux compositions sont probables. Sous 1440 px, l'étiquette reste sous l'en-tête de son bloc."
    message: "Composition probable"
    champs: [entete-score, grille-match, colonne-centre, bloc-composition, etiquette-probable, bande-reservee, terrain-composition, bloc-statistiques, message-stats-vide]
    statut: sourcee
    source: "docs/qa/expectations.md:53-54 (étiquette « Composition probable » sur un match à venir, jamais sans elle) ; lineup-card.tsx:41-44 (data-testid etiquette-probable) ; hauteur de la bande, 24 px, et réservation dans les deux blocs : hypothèse de la maquette, si fausse seule la valeur ou la règle de réservation change"
    tests: ["R14 — à venir probable : deux compositions, chacune avec l'étiquette « Composition probable »", "R14 — terrains à la même ordonnée (±1 px) même si une seule composition est probable", "R14 — centre : message « Pas encore de statistiques. », pas de faits ni de tirs"]

  - id: R15
    etat: charge
    enonce: "Les nombres décimaux des statistiques (xG) gardent la présentation actuelle, un point et deux décimales (« 1.87 », n.toFixed(2) de match.tsx) ; le passage à la virgule française (« 1,87 ») n'est pas fait par ce lot."
    message: ~
    champs: [bloc-statistiques]
    statut: hypothese
    si_faux: "Si la virgule est voulue, c'est un changement de présentation à ajouter au lot (fmt de statRows dans match.tsx et la maquette) ; les autres règles sont inchangées."
    tests: ["R15 — le xG s'affiche avec un point et deux décimales"]

actions:
  - { id: A1, declencheur: ~, appel: "GET /api/live-match/{gameId}/stats", regles: [R1, R2, R3, R4, R5, R6, R7, R8, R9, R10, R11, R12, R13, R14, R15] }
