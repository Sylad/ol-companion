ecran:
  id: composition-match
  titre: Page match — blocs Composition
  route: /match/$gameId
  lot: L43
  largeurs: [1440, 390]
  maquette: docs/specs/composition-match/maquette.html
etats: [vide, chargement, erreur, charge]

champs:
  - { id: message-chargement, libelle: Message de chargement de la page match, type: texte, source: statique, obligatoire: true }
  - { id: message-erreur, libelle: Message d'erreur de la page match, type: texte, source: statique, obligatoire: true }
  - { id: liste-compositions, libelle: Blocs Composition (OL et adversaire), type: liste, source: "GET /api/live-match → lineups", obligatoire: true }
  - { id: bloc-composition, libelle: Bloc Composition d'une équipe, type: carte, source: "GET /api/live-match → lineups", obligatoire: true }
  - { id: titre-composition, libelle: Titre « Composition · club », type: texte, source: "GET /api/live-match → équipe", obligatoire: true }
  - { id: formation-composition, libelle: Pastille de la formation annoncée, type: texte, source: "GET /api/live-match → lineup.formation", obligatoire: false }
  - { id: rangee-composition, libelle: Rangée de joueurs (une par ligne de la formation, gardien en bas), type: ligne, source: "GET /api/live-match → lineup.starters (yardLine, yardSide)", obligatoire: true }
  - { id: banc-composition, libelle: Banc sur une ligne, type: texte, source: "GET /api/live-match → lineup.bench", obligatoire: false }
  - { id: note-repli, libelle: Note de formation inconnue, type: texte, source: statique, obligatoire: false }
  - { id: bloc-statistiques, libelle: Bloc Statistiques resté seul quand la composition manque, type: carte, source: statique, obligatoire: false }
  - { id: absence-composition, libelle: Annotation de maquette (non affichée à l'écran), type: texte, source: statique, obligatoire: false }

regles:
  - id: R1
    etat: chargement
    enonce: Pendant le chargement, la page affiche le message d'attente existant, sans bloc Composition.
    message: "Chargement du match…"
    champs: [message-chargement]
    statut: sourcee
    source: "frontend/src/routes/match.tsx (isLoading) ; état inchangé par le lot"
    tests: ["R1 — chargement : message, aucun bloc Composition"]
  - id: R2
    etat: erreur
    enonce: Si le match ne se charge pas, la page affiche l'erreur existante et aucun bloc Composition.
    message: "Match introuvable"
    champs: [message-erreur]
    statut: sourcee
    source: "frontend/src/routes/match.tsx (isError) ; état inchangé par le lot"
    tests: ["R2 — erreur : message, aucun bloc Composition"]
  - id: R3
    etat: vide
    enonce: Sans composition publiée pour une équipe, son bloc Composition n'est pas affiché (le reste de la page demeure, ici Statistiques).
    message: ~
    champs: [bloc-statistiques]
    masque: [bloc-composition]
    statut: sourcee
    source: "match.tsx (olLineup && …, oppLineup && …) ; comportement inchangé"
    tests: ["R3 — vide : pas de bloc Composition sans lineup"]
  - id: R4
    etat: charge
    enonce: "Les rangées d'un bloc suivent la formation annoncée : le gardien seul en bas, puis une rangée par nombre de la formation, de la défense vers l'attaque, attaque en haut. 4-2-3-1 = 5 rangées (1, 4, 2, 3, 1), 4-1-4-1 = 5 rangées (1, 4, 1, 4, 1), jamais 6 ou 7 rangées. Les joueurs sont répartis en triant les 10 joueurs de champ par yardLine puis yardSide et en découpant selon la formation ; dans une rangée, de gauche à droite (yardSide)."
    message: ~
    champs: [liste-compositions, bloc-composition, titre-composition, formation-composition, rangee-composition, banc-composition]
    statut: sourcee
    source: "demande du lot L43 : « regrouper les lignes comme le terrain de /players » ; yardLine/yardSide : lineup-card.tsx et backend live-match.types.ts"
    tests: ["R4 — 4-2-3-1 : 5 rangées de 1, 4, 2, 3, 1 joueurs (attaque en haut)", "R4 — 4-1-4-1 : 5 rangées de 1, 4, 1, 4, 1 joueurs"]
  - id: R5
    etat: charge
    enonce: "Si la formation est absente ou ne totalise pas 10 joueurs de champ, le bloc garde le regroupement actuel par yardLine, sans pastille de formation, avec une note."
    message: "Formation inconnue : rangées lues d’après les positions annoncées."
    champs: [note-repli, rangee-composition]
    statut: hypothese
    si_faux: "Si le repli doit n'afficher aucune note, ou une rangée unique, seul ce bloc et sa note changent."
    tests: ["R5 — formation absente : rangées par yardLine, note visible, pas de pastille"]
  - id: R6
    etat: charge
    enonce: "Les rangées, la pastille, le banc, les couleurs (rouge OL, bleu adversaire) et les puces de joueur restent ceux du composant actuel ; seul le découpage en rangées change. Le tri d'une rangée suit yardSide, comme avant."
    message: ~
    champs: [banc-composition]
    statut: sourcee
    source: "frontend/src/components/lineup-card.tsx ; docs/qa/expectations.md /match : deux blocs « Composition » de 11"
    tests: ["R6 — 11 titulaires et banc inchangés"]

actions:
  - { id: A1, declencheur: ~, appel: "GET /api/live-match", regles: [R1, R2, R3, R4, R5, R6] }
