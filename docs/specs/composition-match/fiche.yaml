ecran:
  id: composition-match
  titre: Page match — blocs Composition
  route: /match/$gameId
  lot: L43
  largeurs: [1440, 390]
  maquette: docs/specs/composition-match/maquette.html
etats: [vide, chargement, erreur, charge]

champs:
  - { id: message-chargement, libelle: Message de chargement de la page match, type: texte, source: statique, obligatoire: true }
  - { id: message-erreur, libelle: Message d'erreur de la page match, type: texte, source: statique, obligatoire: true }
  - { id: liste-compositions, libelle: Blocs Composition (OL et adversaire), type: liste, source: "GET /api/live-match/{gameId}/stats → lineups", obligatoire: true }
  - { id: bloc-composition, libelle: Bloc Composition d'une équipe, type: carte, source: "GET /api/live-match/{gameId}/stats → lineups", obligatoire: true }
  - { id: titre-composition, libelle: Titre « Composition · club », type: texte, source: "GET /api/live-match/{gameId}/stats → équipe", obligatoire: true }
  - { id: formation-composition, libelle: Pastille de la formation annoncée, type: texte, source: "GET /api/live-match/{gameId}/stats → lineup.formation", obligatoire: false }
  - { id: rangee-composition, libelle: Rangée de joueurs (une par ligne de la formation, gardien en bas), type: ligne, source: "GET /api/live-match/{gameId}/stats → lineup.starters (yardLine, yardSide)", obligatoire: true }
  - { id: banc-composition, libelle: Banc sur une ligne, type: texte, source: "GET /api/live-match/{gameId}/stats → lineup.bench", obligatoire: false }
  - { id: note-repli, libelle: Note de formation inconnue, type: texte, source: statique, obligatoire: false }
  - { id: bloc-statistiques, libelle: Bloc Statistiques resté seul quand la composition manque, type: carte, source: statique, obligatoire: false }
  - { id: absence-composition, libelle: Annotation de maquette (non affichée à l'écran), type: texte, source: statique, obligatoire: false }

regles:
  - id: R1
    etat: chargement
    enonce: Pendant le chargement, la page affiche le message d'attente existant, sans bloc Composition.
    message: "Chargement du match…"
    champs: [message-chargement]
    statut: sourcee
    source: "frontend/src/routes/match.tsx (isLoading) ; état inchangé par le lot"
    tests: ["R1 — chargement : message, aucun bloc Composition"]
  - id: R2
    etat: erreur
    enonce: Si le match ne se charge pas, la page affiche l'erreur existante et aucun bloc Composition.
    message: "Match introuvable"
    champs: [message-erreur]
    statut: sourcee
    source: "frontend/src/routes/match.tsx (isError) ; état inchangé par le lot"
    tests: ["R2 — erreur : message, aucun bloc Composition"]
  - id: R3
    etat: vide
    enonce: Sans composition publiée pour une équipe, son bloc Composition n'est pas affiché (le reste de la page demeure, ici Statistiques).
    message: ~
    champs: [bloc-statistiques]
    masque: [bloc-composition]
    statut: sourcee
    source: "match.tsx (olLineup && …, oppLineup && …) ; comportement inchangé"
    tests: ["R3 — vide : pas de bloc Composition sans lineup"]
  - id: R4
    etat: charge
    enonce: "Les rangées d'un bloc suivent la formation annoncée : le gardien seul en bas, puis une rangée par nombre de la formation, de la défense vers l'attaque, attaque en haut. 4-2-3-1 = 5 rangées (1, 4, 2, 3, 1), 4-1-4-1 = 5 rangées (1, 4, 1, 4, 1), jamais 6 ou 7 rangées ; le nombre de lignes visibles est égal au nombre de rangées (une rangée = une bande horizontale de pastilles, à toute largeur, y compris 320 px ; une pastille ne passe jamais à la ligne suivante, mais son nom peut y tenir sur 2 lignes). Les joueurs sont répartis en triant les 10 joueurs de champ par yardLine puis yardSide et en découpant selon la formation ; dans une rangée, de gauche à droite (yardSide)."
    message: ~
    champs: [liste-compositions, bloc-composition, titre-composition, formation-composition, rangee-composition, banc-composition]
    statut: sourcee
    source: "demande du lot L43 : « regrouper les lignes comme le terrain de /players » ; yardLine/yardSide : lineup-card.tsx et backend live-match.types.ts"
    tests: ["R4 — 4-2-3-1 à 390 et 1440 px : 5 lignes visibles, aucun joueur seul sur une ligne de trop", "R4 — 4-2-3-1 : 5 rangées de 1, 4, 2, 3, 1 joueurs (attaque en haut)", "R4 — 4-1-4-1 : 5 rangées de 1, 4, 1, 4, 1 joueurs"]
  - id: R5
    etat: charge
    enonce: "Si la formation est absente ou ne totalise pas 10 joueurs de champ, le bloc garde le regroupement actuel par yardLine, sans pastille de formation, avec une note."
    message: "Formation inconnue : rangées lues d’après les positions annoncées."
    champs: [note-repli, rangee-composition]
    statut: hypothese
    si_faux: "Si le repli doit n'afficher aucune note, ou une rangée unique, seul ce bloc et sa note changent."
    tests: ["R5 — formation absente : rangées par yardLine, note visible, pas de pastille"]
  - id: R6
    etat: charge
    enonce: "Les rangées, la pastille, le banc, et les couleurs (rouge OL, bleu adversaire sur la bordure) restent ceux du composant actuel ; le numéro de maillot adverse passe à hsl(226 70% 70%) (contraste ≥ 4,5:1, WCAG 1.4.3) ; les rangées deviennent des bandes flex centrées (voir R7) ; le nom d'un joueur est lisible à 320 px (voir R8). Le découpage en rangées change. Le tri d'une rangée suit yardSide, comme avant."
    message: ~
    champs: [banc-composition]
    statut: sourcee
    source: "frontend/src/components/lineup-card.tsx ; docs/qa/expectations.md /match : deux blocs « Composition » de 11"
    tests: ["R6 — numéro adverse : contraste ≥ 4,5:1", "R6 — 11 titulaires et banc inchangés"]
  - id: R7
    etat: charge
    enonce: "Dans un bloc, toutes les pastilles ont la même largeur, celle de la rangée la plus fournie (4 dans les deux formations dessinées), et chaque rangée est centrée dans le bloc : buteur seul, gardien seul et rangée de 2 ou 3 au milieu, comme le terrain de /players. Une rangée = display:flex, justify-content:center, gap 4 px ; pastille = (100 % − (Nmax−1)·4 px) / Nmax."
    message: ~
    champs: [rangee-composition]
    statut: sourcee
    source: "Sylvain 11-10, note L43 : « l'attaquant et le gardien devraient être centrés »"
    tests: ["R7 — rangée centrée : 4-2-3-1, les 11 pastilles ont la même largeur ±1 px ; centre de la pastille du buteur et du gardien = centre du bloc ±1 px", "R7 — rangée centrée : 4-1-4-1, rangées de 1, 4, 1, 4, 1 centrées, pastilles de largeur égale"]
  - id: R8
    etat: charge
    enonce: "La pastille est verticale : le numéro de maillot au-dessus, le nom dessous sur toute la largeur de la pastille, centrés. Un nom ne se coupe qu'au tiret (ou à l'espace) : overflow-wrap:normal, hyphens:manual, jamais d'ellipse ni de line-clamp, jamais de coupure en milieu de mot (« Frankowski » reste entier, « Maitland-Niles » passe sur 2 lignes après le tiret). Taille du nom 11 px ; un nom sans tiret qui dépasse encore la pastille passe à 10 px (à 320 px dans la maquette)."
    message: ~
    champs: [rangee-composition]
    statut: sourcee
    source: "décision lead du 11-10 (~23 h 50) d'après R6 et la règle de Sylvain (R7) : pastille verticale, coupure au tiret seulement, 11 → 10 px, jamais d'ellipse"
    tests: ["R8 — 320, 390 et 1440 px : aucun nom coupé ailleurs qu'après un tiret (ni ellipse, ni débordement de la pastille)", "R8 — pastille : le numéro est au-dessus du nom (même axe vertical, numéro plus haut)", "R8 — nom sans tiret trop long : 10 px, jamais coupé en milieu de mot"]

actions:
  - { id: A1, declencheur: ~, appel: "GET /api/live-match/{gameId}/stats", regles: [R1, R2, R3, R4, R5, R6, R7, R8] }
