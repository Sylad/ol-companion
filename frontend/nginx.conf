# L16 : IP réelle du visiteur pour la limite de débit du backend.
# Cloudflare (tunnel cloudflared → ce nginx) pose CF-Connecting-IP en
# écrasant toute valeur du client. On ne la transmet que si l'en-tête porte
# UNE seule adresse ; sinon (valeurs ajoutées à côté, contenu arbitraire)
# on n'envoie rien et le backend se replie sur req.ip. proxy_set_header
# remplace tout CF-Connecting-IP venu du client.
map $http_cf_connecting_ip $ol_client_ip {
    "~^[0-9A-Fa-f:.]{2,45}$" $http_cf_connecting_ip;
    default                  "";
}

# L54 : Cache-Control des fichiers de /assets/, selon le statut de la réponse.
# Un fichier servi (200, 206, 304) porte une empreinte de contenu dans son nom :
# cache d'un an, jamais revalidé. Toute autre réponse (404 d'un fichier absent
# surtout) ne doit être gardée par personne — ni le navigateur ni Cloudflare,
# qui sinon met en cache la réponse d'un nom en .js / .css.
map $status $ol_assets_cache_control {
    ~^(200|206|304)$ "public, max-age=31536000, immutable";
    default          "no-store";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/events {
        proxy_pass http://ol-backend:3002/api/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $ol_client_ip;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://ol-backend:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $ol_client_ip;
        proxy_read_timeout 60s;
    }

    # L54 : fichiers à empreinte du build (Vite). Un nom absent répond 404,
    # jamais le repli index.html : un navigateur resté sur un ancien index.html
    # demande d'anciens chunks, et recevoir du HTML à leur place casse la page
    # (« Failed to load module script… MIME type of text/html »).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control $ol_assets_cache_control always;
    }

    # L54 : tout le reste — index.html (/, /index.html, repli des routes) et les
    # fichiers copiés tels quels de public/ (sw.js, manifeste, icônes, JSON du
    # plan et des Nouveautés, captures), dont le nom ne change pas d'une
    # livraison à l'autre. `no-cache` = gardé mais revalidé à chaque visite
    # (ETag / Last-Modified → 304) ; sans cet en-tête, le navigateur gardait
    # l'ancien index.html par fraîcheur heuristique après une livraison.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
