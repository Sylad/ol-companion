# L16 : IP réelle du visiteur pour la limite de débit du backend.
# Cloudflare (tunnel cloudflared → ce nginx) pose CF-Connecting-IP en
# écrasant toute valeur du client. On ne la transmet que si l'en-tête porte
# UNE seule adresse ; sinon (valeurs ajoutées à côté, contenu arbitraire)
# on n'envoie rien et le backend se replie sur req.ip. proxy_set_header
# remplace tout CF-Connecting-IP venu du client.
map $http_cf_connecting_ip $ol_client_ip {
    "~^[0-9A-Fa-f:.]{2,45}$" $http_cf_connecting_ip;
    default                  "";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/events {
        proxy_pass http://ol-backend:3002/api/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $ol_client_ip;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://ol-backend:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $ol_client_ip;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
