name: ol-companion

# Lancement local en conteneurs (optionnel ; le dev courant passe par
# `npm run start:dev` + `npm run dev`). La prod tourne sur le k3s de dark-blue,
# déployée par `cadence deliver` (chart developpeur-gitops/charts/ol-companion).

services:
  ol-backend:
    build:
      context: ./backend
    ports:
      - "3002:3002"
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      CORS_ORIGIN: "http://localhost:4202"
      # Comma-separated list of host names forced into locked-demo mode.
      # Any request whose Host (never X-Forwarded-Host) is one of these or a
      # subdomain of one (exact or dot-preceded suffix) is
      # treated as public showcase: PIN is bypassed, writes return 403, the
      # frontend shows a "Mode démo verrouillée" badge.
      # Default covers Cloudflare quick tunnels.
      DEMO_FORCED_HOSTS: "trycloudflare.com,cfargotunnel.com"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  ol-frontend:
    build:
      context: ./frontend
    ports:
      - "4202:80"
    depends_on:
      - ol-backend
    restart: unless-stopped
